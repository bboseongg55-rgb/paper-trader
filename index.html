<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="연습장">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>자동매매 연습장</title>
<style>
/* design-five · 골격: 증권 앱(하단 탭 3개: 계좌·체결내역·수익) · 톤: 실용 · 기준색: 흰 바탕 + 잉크, 상승 빨강·하락 파랑 */
/* layout: one screen per tab; a big number on top, a line chart you can scrub, then plain lists separated by grey bands */
/* Pretendard (SIL OFL 1.1) subset: only used where the device has no Apple system font */
@font-face {
  font-family: "Pretendard Sub";
  src: url("fonts/pretendard-ks.woff2") format("woff2");
  font-weight: 45 920;
  font-style: normal;
  font-display: swap;
}
:root {
  --bg: #ffffff;
  --band: #f2f4f6;
  --ink: #191f28;
  --sub: #4e5968;
  --muted: #6b7684;
  --line: #e5e8eb;
  --up: #e0242f;
  --down: #1b64da;
  --up-soft: rgba(224, 36, 47, 0.1);
  --down-soft: rgba(27, 100, 218, 0.1);
  --ok: #128a4a;
  --warn: #b25000;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Pretendard Sub", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121214; --band: #1c1c20; --ink: #f2f3f5; --sub: #c3c9d0; --muted: #8b95a1; --line: #2a2a30;
    --up: #ff5c62; --down: #5b9bff; --up-soft: rgba(255, 92, 98, 0.16); --down-soft: rgba(91, 155, 255, 0.16);
    --ok: #3ccf7c; --warn: #ffb340; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121214; --band: #1c1c20; --ink: #f2f3f5; --sub: #c3c9d0; --muted: #8b95a1; --line: #2a2a30;
  --up: #ff5c62; --down: #5b9bff; --up-soft: rgba(255, 92, 98, 0.16); --down-soft: rgba(91, 155, 255, 0.16);
  --ok: #3ccf7c; --warn: #ffb340; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); overflow-x: clip; }
body {
  font-family: var(--font); font-size: 17px; line-height: 1.5; word-break: keep-all; overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; -webkit-text-size-adjust: 100%;
  padding-bottom: calc(72px + env(safe-area-inset-bottom));
}
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); } .muted { color: var(--muted); }
.wrap { max-width: 640px; margin: 0 auto; }

/* top bar */
.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(10px + env(safe-area-inset-top)) 20px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); white-space: nowrap; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.live.on i { background: var(--ok); }

section.view { display: none; }
section.view.on { display: block; }
.pad { padding: 0 20px; }
.band { height: 12px; background: var(--band); margin: 24px 0 8px; }

/* the big number */
.hero { padding: 6px 20px 0; }
.hero-label { font-size: 15px; color: var(--sub); }
.hero-value { font-size: 40px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; margin-top: 2px; }
.hero-change { font-size: 17px; font-weight: 600; margin-top: 4px; min-height: 1.5em; }
.hero-change .when { color: var(--muted); font-weight: 500; margin-left: 6px; }

/* chart */
.chart { position: relative; margin: 14px 0 0; height: 190px; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.chart svg { display: block; width: 100%; height: 100%; }
.chart .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 15px; }
.periods { display: flex; gap: 6px; padding: 10px 20px 0; }
.periods button { flex: 1; min-height: 40px; border: 0; border-radius: 10px; background: transparent; color: var(--sub); font-size: 15px; font-weight: 600; cursor: pointer; transition: transform 120ms var(--ease-out), background-color 150ms var(--ease-out); }
.periods button[aria-pressed="true"] { background: var(--band); color: var(--ink); }
.periods button:active { transform: scale(0.97); }

/* key numbers in two columns */
.kv { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px 16px; padding: 20px 20px 0; }
.kv div { display: grid; gap: 2px; min-width: 0; }
.kv span { font-size: 15px; color: var(--muted); }
.kv b { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
.note { margin: 16px 20px 0; padding: 12px 14px; border-radius: 12px; background: var(--band); font-size: 15px; color: var(--sub); display: flex; gap: 10px; align-items: baseline; }
.note i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); transform: translateY(-1px); }

h2 { margin: 0; padding: 4px 20px 6px; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 8px; }
h2 .count { font-size: 17px; color: var(--muted); font-weight: 600; }
h3.day { margin: 0; padding: 18px 20px 4px; font-size: 15px; font-weight: 600; color: var(--muted); }

/* list rows; a tap opens the details */
ul.list { list-style: none; margin: 0; padding: 0; }
ul.list > li > details > summary { list-style: none; cursor: pointer; }
ul.list > li > details > summary::-webkit-details-marker { display: none; }
.row { display: flex; align-items: center; gap: 12px; padding: 14px 20px; min-height: 64px; }
.row:active { background: var(--band); }
.row .l { flex: 1; min-width: 0; display: grid; }
.row .l b { font-size: 17px; font-weight: 600; }
.row .l span { font-size: 15px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .r { text-align: right; display: grid; justify-items: end; }
.row .r b { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .r span { font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.side { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 700; }
.side.buy { background: var(--up-soft); color: var(--up); }
.side.sell { background: var(--down-soft); color: var(--down); }
.more { margin: 0 20px 12px; padding: 12px 14px; border-radius: 12px; background: var(--band); display: grid; gap: 8px; font-size: 15px; }
.more div { display: flex; justify-content: space-between; gap: 12px; }
.more span { color: var(--muted); white-space: nowrap; }
.more b { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.tag { display: inline-block; font-size: 13px; font-weight: 600; line-height: 20px; padding: 0 7px; border-radius: 6px; background: var(--band); color: var(--sub); margin-left: 6px; vertical-align: middle; }
.empty-row { padding: 18px 20px; color: var(--muted); font-size: 16px; }

.filters { display: flex; gap: 8px; padding: 12px 20px 0; }
.filters button { min-height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid var(--line); background: var(--bg); font-size: 15px; font-weight: 600; color: var(--sub); cursor: pointer; transition: transform 120ms var(--ease-out); }
.filters button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.filters button:active { transform: scale(0.97); }
.sumline { padding: 2px 20px 0; font-size: 15px; color: var(--muted); }

.mix { list-style: none; margin: 0; padding: 4px 20px 0; display: grid; gap: 14px; }
.mix li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; }
.mix .name { font-size: 17px; font-weight: 600; }
.mix .stat { font-size: 15px; color: var(--muted); grid-column: 1 / -1; }
.mix .pnl { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }

footer { margin: 28px 20px 8px; font-size: 13px; color: var(--muted); line-height: 1.6; }
.team-head { padding: 4px 20px 0; }
.team-head p { margin: 2px 0 0; font-size: 15px; color: var(--muted); }
.rules { list-style: none; margin: 10px 20px 0; padding: 12px 14px; border-radius: 12px; background: var(--band); display: grid; gap: 8px; font-size: 15px; }
.rules li { display: flex; justify-content: space-between; gap: 12px; }
.rules span { color: var(--muted); }
.rules b { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.rules b.changed::after { content: "조정됨"; margin-left: 6px; font-size: 12px; font-weight: 600; padding: 0 6px; border-radius: 6px; background: var(--up-soft); color: var(--up); vertical-align: 1px; }
details.teamlog { margin: 10px 20px 0; }
details.teamlog > summary { cursor: pointer; font-size: 15px; font-weight: 600; color: var(--sub); padding: 8px 0; list-style: none; }
details.teamlog > summary::-webkit-details-marker { display: none; }
details.teamlog > summary::after { content: " 보기"; color: var(--muted); font-weight: 500; }
details.teamlog[open] > summary::after { content: " 접기"; }
.logitem { padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
.logitem b { display: block; font-size: 16px; }
.logitem .d { color: var(--muted); font-size: 14px; }
.logitem p { margin: 4px 0 0; color: var(--sub); }
.flag { display: inline-block; font-size: 13px; font-weight: 600; line-height: 20px; padding: 0 7px; border-radius: 6px; margin-left: 6px; vertical-align: middle; background: var(--up-soft); color: var(--up); }
.flag.gray { background: var(--band); color: var(--sub); }

/* bottom tabs */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bg); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
}
.tabbar a { display: grid; justify-items: center; gap: 2px; padding: 6px 0; text-decoration: none; color: var(--muted); font-size: 13px; font-weight: 600; border-radius: 10px; }
.tabbar a svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar a[aria-current="page"] { color: var(--ink); }
.tabbar a:active { transform: scale(0.97); }

:focus-visible { outline: 3px solid var(--down); outline-offset: 2px; border-radius: 8px; }
.loading { padding: 80px 20px; text-align: center; color: var(--muted); }
@media (min-width: 700px) { .tabbar { max-width: 640px; margin: 0 auto; border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }
@media (max-width: 350px) { .hero-value { font-size: 34px; } .kv { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { .periods button, .filters button { transition: none; } .periods button:active, .filters button:active, .tabbar a:active { transform: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="title">계좌</h1>
    <span class="live" id="live"><i></i><span>불러오는 중</span></span>
  </header>
  <main>
    <div class="loading" id="loading">계좌를 불러오고 있습니다…</div>
    <section class="view" id="v-account" aria-label="계좌"></section>
    <section class="view" id="v-fills" aria-label="체결내역"></section>
    <section class="view" id="v-profit" aria-label="수익"></section>
    <section class="view" id="v-team" aria-label="AI팀"></section>
  </main>
</div>
<nav class="tabbar" aria-label="화면">
  <a href="#account" data-v="account"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5h14a3 3 0 0 1 3 3v6.5a3 3 0 0 1-3 3h-11a3 3 0 0 1-3-3v-9.5z"/><path d="M3.5 7.5 15 4.5v3"/><circle cx="16.2" cy="13.8" r="1.1"/></svg><span>계좌</span></a>
  <a href="#fills" data-v="fills"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12v17l-3-2-3 2-3-2-3 2v-17z"/><path d="M9 8.5h6M9 12.5h6"/></svg><span>체결내역</span></a>
  <a href="#profit" data-v="profit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 17.5 9 12l4 4 7.5-7.5"/><path d="M15 8.5h5.5V14"/></svg><span>수익</span></a>
  <a href="#team" data-v="team"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8.5" r="3"/><path d="M3.5 19.5c0-3.1 2.4-5.3 5.5-5.3s5.5 2.2 5.5 5.3"/><circle cx="17" cy="9.5" r="2.4"/><path d="M15.8 14.3c2.5.3 4.4 2.2 4.4 5"/></svg><span>AI팀</span></a>
</nav>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = (v, d = 2) => Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  const usd = (v, d = 2) => (v < 0 ? '−$' : '$') + fmt(v, d);
  const sgnUsd = (v, d = 2) => (v >= 0.005 ? '+$' : v <= -0.005 ? '−$' : '$') + fmt(v, d);
  const pct = (v, d = 2) => (v >= 0.00005 ? '+' : v <= -0.00005 ? '−' : '') + fmt(v * 100, d) + '%';
  const cls = (v) => (v >= 0.005 ? 'up' : v <= -0.005 ? 'down' : '');
  const WD = ['일', '월', '화', '수', '목', '금', '토'];
  const dLabel = (d) => `${+d.slice(5, 7)}월 ${+d.slice(8, 10)}일 (${WD[new Date(d + 'T12:00:00Z').getUTCDay()]})`;
  const PB = { bo: '돌파', pb: '눌림목', dt: '단타', hedge: '헷지' };
  const PB_LONG = { bo: '신고가 돌파', pb: '추세 눌림목', dt: '당일 단타', hedge: 'S&P 500 인버스 헷지' };
  const VIEWS = ['account', 'fills', 'profit', 'team'];
  const TITLES = { account: '계좌', fills: '체결내역', profit: '수익', team: 'AI팀' };
  const HOLIDAYS = ['2026-11-26', '2026-12-25', '2027-01-01', '2027-01-18', '2027-02-15', '2027-03-26', '2027-05-31', '2027-06-18', '2027-07-05', '2027-09-06', '2027-11-25', '2027-12-24'];
  const EARLY_CLOSE = ['2026-11-27', '2026-12-24', '2027-11-26'];
  let S = null, period = 'day', filter = 'all';

  function nyNow() {
    const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date()).map((x) => [x.type, x.value]));
    return { date: `${p.year}-${p.month}-${p.day}`, hm: `${p.hour}:${p.minute}` };
  }
  function marketOpen() {
    const n = nyNow(), wd = new Date(n.date + 'T12:00:00Z').getUTCDay();
    if (wd === 0 || wd === 6 || HOLIDAYS.includes(n.date)) return false;
    return n.hm >= '09:30' && n.hm < (EARLY_CLOSE.includes(n.date) ? '13:00' : '16:00');
  }
  const clock = (iso) => { try { return new Intl.DateTimeFormat('ko-KR', { timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit' }).format(new Date(iso)); } catch (e) { return ''; } };
  function setLive() {
    const on = marketOpen();
    $('live').className = 'live' + (on ? ' on' : '');
    $('live').lastElementChild.textContent = S ? `${on ? '장중' : '장 마감'} · ${clock(S.built)} 업데이트` : '불러오는 중';
  }

  // ── tabs
  function showView() {
    const h = (location.hash || '#account').slice(1);
    const v = VIEWS.includes(h) ? h : 'account';
    document.querySelectorAll('.tabbar a').forEach((a) => a.setAttribute('aria-current', a.dataset.v === v ? 'page' : 'false'));
    document.querySelectorAll('section.view').forEach((s) => s.classList.toggle('on', s.id === 'v-' + v));
    $('title').textContent = TITLES[v];
    if (v === 'account') drawChart();
  }
  window.addEventListener('hashchange', () => { showView(); window.scrollTo(0, 0); });

  // ── account value over the chosen period
  function series() {
    const a = S.account, eqs = a.equity;
    const prevClose = eqs.length > 1 ? eqs[eqs.length - 2].eq : S.capital;
    if (period === 'day') {
      const pts = (a.intraday || []).map((x) => ({ label: `${dLabel(S.asOf.date)} ${x.t}`, v: x.eq }));
      if (pts.length >= 2) return { pts, base: prevClose, name: S.asOf.prov ? '오늘' : '최근 거래일' };
    }
    const n = period === 'week' ? 5 : period === 'month' ? 21 : 100000;
    const tail = eqs.slice(-Math.min(eqs.length, n));
    const pts = [{ label: '시작', v: S.capital }].concat(tail.map((e) => ({ label: e.prov ? `${dLabel(e.date)} ${e.time} 기준` : dLabel(e.date), v: e.eq })));
    if (period !== 'all' && eqs.length > n) pts.shift();
    const base = period === 'all' || eqs.length <= n ? S.capital : pts[0].v;
    return { pts, base, name: { day: '최근 거래일', week: '1주', month: '1개월', all: '시작 후' }[period] };
  }
  function heroChange(v, base, when) {
    const d = v - base;
    return `<span class="${cls(d)}">${sgnUsd(d)} (${pct(base ? d / base : 0)})</span><span class="when">${esc(when)}</span>`;
  }
  function drawChart() {
    const el = document.querySelector('#v-account .chart');
    if (!el || !S || !S.account) return;
    const sr = series(), pts = sr.pts;
    const W = Math.floor(el.clientWidth), H = Math.floor(el.clientHeight);
    if (!W || !H) return;
    const end = pts[pts.length - 1].v;
    $('heroValue').textContent = usd(end);
    $('heroChange').innerHTML = heroChange(end, sr.base, sr.name);
    if (pts.length < 2) { el.innerHTML = '<div class="empty">매매가 시작되면 그래프가 그려집니다</div>'; return; }
    const vals = pts.map((p) => p.v).concat([sr.base]);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const padV = (hi - lo) * 0.12 || Math.max(1, hi * 0.0005); lo -= padV; hi += padV;
    const L = 20, R = 20, T = 12, B = 12;
    const x = (i) => L + (i / (pts.length - 1)) * (W - L - R);
    const y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
    const col = end >= sr.base ? 'var(--up)' : 'var(--down)';
    const d = pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join('');
    const yb = y(sr.base).toFixed(1);
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true" focusable="false">
      <line x1="${L}" x2="${W - R}" y1="${yb}" y2="${yb}" stroke-width="1.2" stroke-dasharray="2 5" style="stroke:var(--muted)"/>
      <path d="${d}" fill="none" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" style="stroke:${col}"/>
      <line class="cur" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke-width="1" style="stroke:var(--muted);display:none"/>
      <circle class="dot" cx="${x(pts.length - 1).toFixed(1)}" cy="${y(end).toFixed(1)}" r="5" stroke-width="2.5" style="fill:${col};stroke:var(--bg)"/></svg>`;
    el.setAttribute('role', 'img');
    el.setAttribute('aria-label', `${sr.name} 계좌 금액 ${usd(pts[0].v)}에서 ${usd(end)}`);
    // touch or hover to read any point
    const svg = el.querySelector('svg'), cur = svg.querySelector('.cur'), dot = svg.querySelector('.dot');
    const at = (clientX) => {
      const r = svg.getBoundingClientRect();
      const i = Math.max(0, Math.min(pts.length - 1, Math.round(((clientX - r.left) / r.width * W - L) / (W - L - R) * (pts.length - 1))));
      cur.setAttribute('x1', x(i)); cur.setAttribute('x2', x(i)); cur.style.display = '';
      dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(pts[i].v));
      $('heroValue').textContent = usd(pts[i].v);
      $('heroChange').innerHTML = heroChange(pts[i].v, sr.base, pts[i].label);
    };

  let rz = 0;
  window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(drawChart); });

  // ── screens
  const kv = (rows) => '<div class="kv">' + rows.map(([k, v, c]) => `<div><span>${k}</span><b class="${c || ''}">${v}</b></div>`).join('') + '</div>';

  function renderAccount() {

    const notes = [];
    if (S.gate && !S.gate.ok) notes.push(`시장이 하락 추세라 돌파·눌림목 새 매수는 쉬고 ${a.dtPaused ? '있습니다. 단타도 성과가 나빠 쉬는 중입니다.' : '단타만 합니다.'}`);
    else if (a.dtPaused) notes.push('단타는 최근 성과가 나빠 잠시 쉬는 중입니다.');
    if (a.risk && a.risk.blocked && a.risk.blocked.length) notes.push(a.risk.blocked.join(' '));
    else if (a.risk && a.risk.mult < 1) notes.push(`손실 관리: ${a.risk.why.join(' ')}`);
    h += notes.map((n) => `<p class="note"><i aria-hidden="true"></i><span>${esc(n)}</span></p>`).join('');

    h += `<div class="band"></div><h2>보유 종목 <span class="count num">${a.open.length + (hg ? 1 : 0)}</span></h2>`;
    if (!a.open.length && !hg) h += '<p class="empty-row">보유 종목이 없습니다. 전부 현금입니다.</p>';
    if (hg) {
      const hp = hg.value + hg.got - hg.paid;
      h += `<ul class="list"><li><details><summary class="row"><span class="l"><b>SH<span class="tag">헷지</span></b><span>S&amp;P 500 인버스(−1배)</span></span>
        <span class="r"><b>${usd(hg.value)}</b><span class="${cls(hp)}">${sgnUsd(hp)}</span></span></summary>
        ${more([['하는 일', 'S&amp;P 500이 내리면 오르고, 오르면 내립니다'], ['시작', dLabel(hg.since)], ['시작 때 S&amp;P 500', hg.spx0.toLocaleString('en-US')], ['헷지 비율', `보유 주식의 ${Math.round((hg.ratio || 0) * 100)}%`], ['담당', '리스크·헷지팀']])}</details></li></ul>`;
    }
    if (a.open.length) h += '<ul class="list">' + a.open.slice().sort((p, q) => q.value - p.value).map((p) => `<li><details><summary class="row">
        <span class="l"><b>${esc(p.sym)}<span class="tag">${PB[p.pb]}</span></b><span>${esc(p.name)} · ${p.qty.toLocaleString()}주</span></span>
        <span class="r"><b>${usd(p.value)}</b><span class="${cls(p.pnl)}">${sgnUsd(p.pnl)} (${pct(p.pct)})</span></span></summary>
        ${more([['평균 매수가', usd(p.entry)], ['현재가', usd(p.price)], ['손절가', usd(p.stop)], ['매수', p.pb === 'dt' ? `오늘 ${esc(p.et || '')}` : `${dLabel(p.entryDate)} 장 마감`], ['방법', PB_LONG[p.pb]]])}</details></li>`).join('') + '</ul>';

    h += recent.length ? '<ul class="list">' + recent.map(fillRow).join('') + '</ul><p class="sumline"><a href="#fills" style="color:inherit">체결내역 전체 보기</a></p>' : '<p class="empty-row">아직 체결된 매매가 없습니다.</p>';

    $('v-account').querySelectorAll('.periods button').forEach((b) => b.addEventListener('click', () => {

  function fillRow(o) {
    if (o.pb === 'hedge') {
      return `<li><details><summary class="row"><span class="side ${o.side}">${o.side === 'buy' ? '매수' : '매도'}</span>
        <span class="l"><b>SH<span class="tag">헷지</span></b><span>S&amp;P 500 인버스 · S&amp;P ${Number(o.spx).toLocaleString('en-US')}</span></span>
        <span class="r"><b>${usd(o.amount)}</b><span class="muted">${esc(o.time || '장 마감')}</span></span></summary>
        ${more([['종류', 'S&amp;P 500 인버스(−1배), SH와 같은 방식'], ['체결 금액', usd(o.amount)], ['이유', esc(o.why || '')], ['헷지 비율', `보유 주식의 ${Math.round((o.ratio || 0) * 100)}%`], ['수수료', usd(o.fee || 0) + (o.side === 'sell' ? ' (SEC)' : '')], ['담당', '리스크·헷지팀']])}</details></li>`;
    }
    const amt = o.qty * o.price;
    const when = o.time || '장 마감';
    if (o.side === 'buy') {
      return `<li><details><summary class="row"><span class="side buy">매수</span>
        <span class="l"><b>${esc(o.sym)}<span class="tag">${PB[o.pb]}</span></b><span>${o.qty.toLocaleString()}주 · ${usd(o.price)}</span></span>
        <span class="r"><b>${usd(amt)}</b><span class="muted">${esc(when)}</span></span></summary>
        ${more([['종목', esc(o.name)], ['체결가', usd(o.price)], ['수량', o.qty.toLocaleString() + '주'], ['체결 금액', usd(amt)], ['수수료', usd(o.fee || 0)], ['상태', o.open ? '보유 중' : '매도 완료']])}</details></li>`;
    }
    const fd = o.feeDetail || {};
    return `<li><details><summary class="row"><span class="side sell">매도</span>
      <span class="l"><b>${esc(o.sym)}<span class="tag">${PB[o.pb]}</span></b><span>${o.qty.toLocaleString()}주 · ${usd(o.price)}</span></span>

        ['수수료', `${usd(o.fee || 0)}` + (o.fee ? ` (SEC ${usd(fd.sec || 0)} · FINRA ${usd(fd.taf || 0)} · CAT ${usd(fd.cat || 0)})` : '')]])}</details></li>`;
  }

  function renderFills() {
    const all = S.orders || [];
    const list = all.filter((o) => filter === 'all' || o.side === filter);
    const buys = all.filter((o) => o.side === 'buy').length, sells = all.length - buys;
    const fees = all.reduce((s, o) => s + (o.fee || 0), 0);
    let h = `<div class="filters" role="group" aria-label="체결 종류">${[['all', '전체'], ['buy', '매수'], ['sell', '매도']].map(([k, t]) => `<button type="button" data-f="${k}" aria-pressed="${filter === k}">${t}</button>`).join('')}</div>
      <p class="sumline num" style="padding-top:12px">매수 ${buys}건 · 매도 ${sells}건 · 수수료 합계 ${usd(fees)}</p>`;

      if (o.date !== day) { if (day) h += '</ul>'; day = o.date; h += `<h3 class="day">${dLabel(day)}</h3><ul class="list">`; }

    $('v-fills').querySelectorAll('.filters button').forEach((b) => b.addEventListener('click', () => { filter = b.dataset.f; renderFills(); }));
  }

  function renderProfit() {
    const a = S.account;
    if (!a) { $('v-profit').innerHTML = '<p class="empty-row">연습 계좌가 아직 시작되지 않았습니다.</p>'; return; }
    const last = a.equity[a.equity.length - 1], st = a.stats || {};
    const total = last.eq - S.capital;
    const hb = (S.byPb || {}).hedge || { pnl: 0, open: 0 };
    const unreal = a.open.reduce((s, p) => s + p.pnl, 0) + (hb.open || 0);

    const sells = (S.orders || []).filter((o) => o.side === 'sell');
    const wins = sells.filter((o) => o.pnl > 0), losses = sells.filter((o) => o.pnl <= 0);

    let h = `<div class="hero"><div class="hero-label">총 수익 (${dLabel(S.liveStart)} 시작)</div>

      <div class="hero-change num"><span class="${cls(total)}">${pct(total / S.capital)}</span><span class="when">S&amp;P 500 같은 기간 ${pct(st.bench || 0)}</span></div></div>`;
    h += kv([
      ['실현 손익', sgnUsd(realized), cls(realized)],

      <span class="r"><b class="${cls(d.pnl)}">${sgnUsd(d.pnl)}</b><span class="${cls(d.pnl)}">${pct(d.pct)}</span></span></div></li>`).join('') + '</ul>';
    // by method, with the share of risk the strategy tournament gives each
    const bp = S.byPb || {}, mm = a.mults || {};
    h += `<div class="band"></div><h2>방법별 수익</h2><ul class="mix">` + ['dt', 'bo', 'pb'].map((k) => {
      const b = bp[k] || { n: 0, wins: 0, pnl: 0 };
      return `<li><span class="name">${PB_LONG[k]}</span><span class="pnl ${cls(b.pnl)}">${sgnUsd(b.pnl)}</span>
        <span class="stat">매도 ${b.n}건${b.n ? ` · 승률 ${Math.round((b.wins / b.n) * 100)}%` : ''} · AI 위험 배분 ${Math.round((mm[k] == null ? 0 : mm[k]) * 100)}%${k === 'dt' && a.dtPaused ? ' · 쉬는 중' : ''}</span></li>`;
    }).join('') + (bp.hedge ? `<li><span class="name">S&amp;P 500 인버스 헷지</span><span class="pnl ${cls(bp.hedge.pnl + (bp.hedge.open || 0))}">${sgnUsd(bp.hedge.pnl + (bp.hedge.open || 0))}</span>
        <span class="stat">헷지 ${bp.hedge.n}번 정리${bp.hedge.open ? ' · 지금 보유 중' : ''} · 리스크·헷지팀 담당</span></li>` : '') + '</ul>';
    h += `<div class="band"></div><h2>매매 성적</h2>`;
    h += kv([
      ['승률', sells.length ? Math.round((wins.length / sells.length) * 100) + '%' : '-'],
      ['매도 건수', sells.length + '건'],
      ['평균 이익', wins.length ? sgnUsd(avg(wins)) : '-', wins.length ? 'up' : ''],
      ['평균 손실', losses.length ? sgnUsd(avg(losses)) : '-', losses.length ? cls(avg(losses)) : ''],
    ]);

    $('v-profit').innerHTML = h;
  }

  const ruleVal = (r) => {
    const v = r.value;
    if (r.key === 'maxPosW') return Math.round(v * 100) + '%';
    if (r.unit === '백분위') return `상위 ${100 - v}%`;
    if (r.unit === '%') return v + '%';
    if (r.unit === '거래일') return v + '거래일';
    if (r.unit === '단계') return v + '단계';
    return `${r.unit} ${v}`.trim();
  };

  };
  function renderTeam() {

        <span class="r"><b class="${cls(x.ret6m)}">${pct(x.ret6m, 1)}</b><span class="muted">6개월 · 상위 ${Math.max(1, 100 - x.rs)}%</span></span></div></li>`).join('') : '<li><p class="empty-row">상승 추세인 후보가 없습니다.</p></li>') + '</ul>');

    const nr = T.exit.nearest;
    h += teamBlock(T.exit, '보유 종목마다 손절가·추적 손절·기한·목표가를 지키고, 단타는 장 마감 전에 모두 팝니다.',

  function render() {

    renderTeam();
    if ($('loading')) $('loading').remove();
    setLive();
    showView();
  }

  // ── data: the newest account file straight from the repository, the published copy as the fallback
  const RAW = (() => {
    const m = /^([^.]+)\.github\.io$/.exec(location.hostname), repo = location.pathname.split('/').filter(Boolean)[0];
    return m && repo ? `https://raw.githubusercontent.com/${m[1]}/${repo}/main/data/state.json` : null;
  })();
  async function load() {
    if (RAW) {
      try { const r = await fetch(RAW + '?ts=' + Date.now(), { cache: 'no-store' }); if (r.ok) return await r.json(); } catch (e) { /* fall back */ }
    }
    const r = await fetch('data/state.json?ts=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('계좌 파일을 받지 못했습니다 (' + r.status + ')');
    return r.json();
  }
  async function refresh() {
    try {
      const st = await load();
      if (!S || st.built !== S.built) { S = st; render(); } else setLive();
    } catch (e) { /* keep the last good state */ }
  }
  async function main() {
    showView();
    try { S = await load(); render(); }
    catch (err) { $('loading').textContent = '불러오지 못했습니다: ' + (err.message || err) + ' 잠시 뒤 새로 고침해 주세요.'; }
    setInterval(() => { if (document.visibilityState === 'visible') refresh(); }, 60000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
  }
  main();
})();
</script>
</body>
</html>
