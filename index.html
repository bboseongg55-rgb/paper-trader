<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="연습장">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>자동매매 연습장</title>
<style>
/* design-five · 골격: 증권 앱(하단 탭 3개: 계좌·체결내역·수익) · 톤: 실용 · 기준색: 흰 바탕 + 잉크, 상승 빨강·하락 파랑 */
/* layout: one screen per tab; a big number on top, a line chart you can scrub, then plain lists separated by grey bands */
/* Pretendard (SIL OFL 1.1) subset: only used where the device has no Apple system font */
@font-face {
  font-family: "Pretendard Sub";
  src: url("fonts/pretendard-ks.woff2") format("woff2");
  font-weight: 45 920;
  font-style: normal;
  font-display: swap;
}
:root {
  --bg: #ffffff;
  --band: #f2f4f6;
  --ink: #191f28;
  --sub: #4e5968;
  --muted: #6b7684;
  --line: #e5e8eb;
  --up: #e0242f;
  --down: #1b64da;
  --up-soft: rgba(224, 36, 47, 0.1);
  --down-soft: rgba(27, 100, 218, 0.1);
  --ok: #128a4a;
  --warn: #b25000;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Pretendard Sub", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  /* chart series: indexes and portfolio parts (categorical order, never by rank of value) */
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s-other: #8b95a1; --s-cash: #d1d6db;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121214; --band: #1c1c20; --ink: #f2f3f5; --sub: #c3c9d0; --muted: #8b95a1; --line: #2a2a30;
    --up: #ff5c62; --down: #5b9bff; --up-soft: rgba(255, 92, 98, 0.16); --down-soft: rgba(91, 155, 255, 0.16);
    --ok: #3ccf7c; --warn: #ffb340; color-scheme: dark;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s-other: #6b7684; --s-cash: #3a3f46;
  }
}
:root[data-theme="dark"] {
  --bg: #121214; --band: #1c1c20; --ink: #f2f3f5; --sub: #c3c9d0; --muted: #8b95a1; --line: #2a2a30;
  --up: #ff5c62; --down: #5b9bff; --up-soft: rgba(255, 92, 98, 0.16); --down-soft: rgba(91, 155, 255, 0.16);
  --ok: #3ccf7c; --warn: #ffb340; color-scheme: dark;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s-other: #6b7684; --s-cash: #3a3f46;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); overflow-x: clip; }
body {
  font-family: var(--font); font-size: 17px; line-height: 1.5; word-break: keep-all; overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; -webkit-text-size-adjust: 100%;
  padding-bottom: calc(72px + env(safe-area-inset-bottom));
}
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); } .muted { color: var(--muted); }
.wrap { max-width: 640px; margin: 0 auto; }

/* top bar */
.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(10px + env(safe-area-inset-top)) 20px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); white-space: nowrap; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.live.on i { background: var(--ok); }

section.view { display: none; }
section.view.on { display: block; }
.pad { padding: 0 20px; }
.band { height: 12px; background: var(--band); margin: 24px 0 8px; }

/* the big number */
.hero { padding: 6px 20px 0; }
.hero-label { font-size: 15px; color: var(--sub); }
.hero-value { font-size: 40px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; margin-top: 2px; }
.hero-change { font-size: 17px; font-weight: 600; margin-top: 4px; min-height: 1.5em; }
.hero-change .when { color: var(--muted); font-weight: 500; margin-left: 6px; }

/* chart */
.chart { position: relative; margin: 14px 0 0; height: 190px; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.chart svg { display: block; width: 100%; height: 100%; }
.chart .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 15px; }
.periods { display: flex; gap: 6px; padding: 10px 20px 0; }
.periods button { flex: 1; min-height: 40px; border: 0; border-radius: 10px; background: transparent; color: var(--sub); font-size: 15px; font-weight: 600; cursor: pointer; transition: transform 120ms var(--ease-out), background-color 150ms var(--ease-out); }
.periods button[aria-pressed="true"] { background: var(--band); color: var(--ink); }
.periods button:active { transform: scale(0.97); }
/* index comparison: chips turn index lines on, the chart then shows % change from the same start */
.cmp { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 12px 20px 0; }
.cmp-label { font-size: 15px; font-weight: 600; color: var(--muted); margin-right: 2px; }
.cmp button { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border-radius: 20px; border: 1px solid var(--line); background: var(--bg); font-size: 15px; font-weight: 600; color: var(--sub); cursor: pointer; white-space: nowrap; transition: transform 120ms var(--ease-out), background-color 150ms var(--ease-out); }
.cmp button[aria-pressed="true"] { background: var(--band); border-color: var(--band); color: var(--ink); }
.cmp button[aria-pressed="false"] .key { opacity: 0.4; }
.cmp button:active { transform: scale(0.97); }
.key { flex: none; display: inline-block; width: 14px; height: 3px; border-radius: 2px; }
.legend { list-style: none; margin: 8px 20px 0; padding: 0; display: grid; gap: 4px; }
.legend[hidden] { display: none; }
.badge { display: inline-flex; align-items: center; gap: 5px; margin-left: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
.badge i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.badge.on i { background: var(--ok); }
.range { display: flex; align-items: flex-end; gap: 8px; padding: 10px 20px 0; }
.range[hidden] { display: none; }
.range label { flex: 1; min-width: 0; display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.range input { min-height: 44px; width: 100%; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font: inherit; font-size: 17px; }
.range .dash { padding-bottom: 10px; color: var(--muted); }
.legend li { display: flex; align-items: center; gap: 10px; font-size: 16px; min-height: 26px; }
.legend li span { flex: 1; min-width: 0; color: var(--sub); }
.legend li b { font-weight: 600; font-variant-numeric: tabular-nums; }
.legend .when { color: var(--muted); font-size: 14px; }
/* portfolio ring */
.alloc { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 16px; align-items: center; padding: 8px 20px 0; }
.donut { position: relative; width: 168px; height: 168px; }
.donut svg { display: block; width: 100%; height: 100%; }
.donut path { cursor: pointer; transition: opacity 150ms var(--ease-out); }
.donut svg.sel path:not(.on) { opacity: 0.3; }
.donut .c { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; text-align: center; pointer-events: none; padding: 0 34px; line-height: 1.3; }
.donut .c span { font-size: 13px; color: var(--muted); max-width: 100px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.donut .c b { font-size: 17px; font-weight: 700; }
.alloc ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; min-width: 0; }
.alloc li button { width: 100%; display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; align-items: center; gap: 8px; min-height: 36px; padding: 2px 8px; border: 0; border-radius: 8px; background: transparent; text-align: left; cursor: pointer; }
.alloc li button[aria-pressed="true"] { background: var(--band); }
.alloc .sw { width: 12px; height: 12px; border-radius: 3px; }
.alloc .nm { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.alloc .sh { font-size: 15px; font-variant-numeric: tabular-nums; color: var(--sub); }
@media (max-width: 370px) { .alloc { grid-template-columns: minmax(0, 1fr); justify-items: center; } .alloc ul { width: 100%; } }

/* key numbers in two columns */
.kv { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px 16px; padding: 20px 20px 0; }
.kv div { display: grid; gap: 2px; min-width: 0; }
.kv > div > span { font-size: 15px; color: var(--muted); }
.kv b { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
.note { margin: 16px 20px 0; padding: 12px 14px; border-radius: 12px; background: var(--band); font-size: 15px; color: var(--sub); display: flex; gap: 10px; align-items: baseline; }
.note i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); transform: translateY(-1px); }

h2 { margin: 0; padding: 4px 20px 6px; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 8px; }
h2 .count { font-size: 17px; color: var(--muted); font-weight: 600; }
h3.day { margin: 0; padding: 18px 20px 4px; font-size: 15px; font-weight: 600; color: var(--muted); }

/* list rows; a tap opens the details */
ul.list { list-style: none; margin: 0; padding: 0; }
ul.list > li > details > summary { list-style: none; cursor: pointer; }
ul.list > li > details > summary::-webkit-details-marker { display: none; }
.row { display: flex; align-items: center; gap: 12px; padding: 14px 20px; min-height: 64px; }
.row:active { background: var(--band); }
.row .l { flex: 1; min-width: 0; display: grid; }
.row .l b { font-size: 17px; font-weight: 600; }
.row .l span { font-size: 15px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .r { text-align: right; display: grid; justify-items: end; }
.row .r b { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .r span { font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.side { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 700; }
.side.buy { background: var(--up-soft); color: var(--up); }
.side.sell { background: var(--down-soft); color: var(--down); }
.side:not(.buy):not(.sell) { background: var(--band); color: var(--sub); }
.more { margin: 0 20px 12px; padding: 12px 14px; border-radius: 12px; background: var(--band); display: grid; gap: 8px; font-size: 15px; }
.more div { display: flex; justify-content: space-between; gap: 12px; }
.more span { color: var(--muted); white-space: nowrap; }
.more b { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.tag { display: inline-block; font-size: 13px; font-weight: 600; line-height: 20px; padding: 0 7px; border-radius: 6px; background: var(--band); color: var(--sub); margin-left: 6px; vertical-align: middle; }
.empty-row { padding: 18px 20px; color: var(--muted); font-size: 16px; }
.mac { margin: 4px 20px 0; padding: 14px 16px; border-radius: 14px; background: var(--band); }
.mac-head { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.45; word-break: keep-all; overflow-wrap: anywhere; }
.mac-sub { display: block; margin-top: 6px; font-size: 14px; color: var(--muted); }
.prio { list-style: none; margin: 0; padding: 6px 0 0; }
.prio li { display: flex; gap: 12px; padding: 12px 20px; align-items: flex-start; }
.prio .rk { flex: none; min-width: 52px; height: 28px; padding: 0 8px; border-radius: 14px; display: grid; place-items: center; font-size: 14px; font-weight: 700; background: var(--ink); color: var(--bg); }
.prio li.off .rk { background: var(--band); color: var(--muted); }
.prio .bd { min-width: 0; display: grid; gap: 4px; }
.prio .bd b { font-size: 17px; font-weight: 600; }
.prio li.off .bd b { color: var(--sub); }
.prio .bd p { margin: 0; font-size: 15px; color: var(--sub); line-height: 1.5; word-break: keep-all; overflow-wrap: anywhere; }
.sub-h { margin: 14px 20px 0; font-size: 16px; font-weight: 700; color: var(--sub); }
.sig { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 12px 20px 0; }
.sig div { display: grid; gap: 2px; min-width: 0; }
.sig span { font-size: 14px; color: var(--muted); word-break: keep-all; }
.sig b { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
.sig small { font-size: 14px; color: var(--muted); line-height: 1.4; word-break: keep-all; }
.why { margin: -4px 20px 0; padding: 0 0 14px; font-size: 15px; color: var(--sub); line-height: 1.5; word-break: keep-all; overflow-wrap: anywhere; }
.why b { font-weight: 600; color: var(--ink); margin-right: 6px; }
@media (max-width: 350px) { .sig { grid-template-columns: minmax(0, 1fr); } }

.filters { display: flex; gap: 8px; padding: 12px 20px 0; }
.filters button { min-height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid var(--line); background: var(--bg); font-size: 15px; font-weight: 600; color: var(--sub); cursor: pointer; transition: transform 120ms var(--ease-out); }
.filters button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.filters button:active { transform: scale(0.97); }
.sumline { padding: 2px 20px 0; font-size: 15px; color: var(--muted); }

.mix { list-style: none; margin: 0; padding: 4px 20px 0; display: grid; gap: 14px; }
.mix li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; }
.mix .name { font-size: 17px; font-weight: 600; }
.mix .stat { font-size: 15px; color: var(--muted); grid-column: 1 / -1; }
.mix .pnl { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }

footer { margin: 28px 20px 8px; font-size: 13px; color: var(--muted); line-height: 1.6; }
.team-head { padding: 4px 20px 0; }
.team-head p { margin: 2px 0 0; font-size: 15px; color: var(--muted); }
.rules { list-style: none; margin: 10px 20px 0; padding: 12px 14px; border-radius: 12px; background: var(--band); display: grid; gap: 8px; font-size: 15px; }
.rules li { display: flex; justify-content: space-between; gap: 12px; }
.rules span { color: var(--muted); }
.rules b { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.rules b.changed::after { content: "조정됨"; margin-left: 6px; font-size: 12px; font-weight: 600; padding: 0 6px; border-radius: 6px; background: var(--up-soft); color: var(--up); vertical-align: 1px; }
details.teamlog { margin: 10px 20px 0; }
details.teamlog > summary { cursor: pointer; font-size: 15px; font-weight: 600; color: var(--sub); padding: 8px 0; list-style: none; }
details.teamlog > summary::-webkit-details-marker { display: none; }
details.teamlog > summary::after { content: " 보기"; color: var(--muted); font-weight: 500; }
details.teamlog[open] > summary::after { content: " 접기"; }
.logitem { padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
.logitem b { display: block; font-size: 16px; }
.logitem .d { color: var(--muted); font-size: 14px; }
.logitem p { margin: 4px 0 0; color: var(--sub); }
.flag { display: inline-block; font-size: 13px; font-weight: 600; line-height: 20px; padding: 0 7px; border-radius: 6px; margin-left: 6px; vertical-align: middle; background: var(--up-soft); color: var(--up); }
.flag.gray { background: var(--band); color: var(--sub); }

/* bottom tabs */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bg); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
}
.tabbar a { display: grid; justify-items: center; gap: 2px; padding: 6px 0; text-decoration: none; color: var(--muted); font-size: 13px; font-weight: 600; border-radius: 10px; }
.tabbar a svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar a[aria-current="page"] { color: var(--ink); }
.tabbar a:active { transform: scale(0.97); }

:focus-visible { outline: 3px solid var(--down); outline-offset: 2px; border-radius: 8px; }
.loading { padding: 80px 20px; text-align: center; color: var(--muted); }
@media (min-width: 700px) { .tabbar { max-width: 640px; margin: 0 auto; border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }
@media (max-width: 350px) { .hero-value { font-size: 34px; } .kv { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { .periods button, .filters button, .cmp button, .donut path { transition: none; } .periods button:active, .filters button:active, .cmp button:active, .tabbar a:active { transform: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="title">계좌</h1>
    <span class="live" id="live"><i></i><span>불러오는 중</span></span>
  </header>
  <main>
    <div class="loading" id="loading">계좌를 불러오고 있습니다…</div>
    <section class="view" id="v-account" aria-label="계좌"></section>
    <section class="view" id="v-fills" aria-label="체결내역"></section>
    <section class="view" id="v-profit" aria-label="수익"></section>
    <section class="view" id="v-team" aria-label="AI팀"></section>
    <section class="view" id="v-coin" aria-label="코인"></section>
  </main>
</div>
<nav class="tabbar" aria-label="화면">
  <a href="#account" data-v="account"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5h14a3 3 0 0 1 3 3v6.5a3 3 0 0 1-3 3h-11a3 3 0 0 1-3-3v-9.5z"/><path d="M3.5 7.5 15 4.5v3"/><circle cx="16.2" cy="13.8" r="1.1"/></svg><span>계좌</span></a>
  <a href="#fills" data-v="fills"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12v17l-3-2-3 2-3-2-3 2v-17z"/><path d="M9 8.5h6M9 12.5h6"/></svg><span>체결내역</span></a>
  <a href="#profit" data-v="profit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 17.5 9 12l4 4 7.5-7.5"/><path d="M15 8.5h5.5V14"/></svg><span>수익</span></a>
  <a href="#team" data-v="team"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8.5" r="3"/><path d="M3.5 19.5c0-3.1 2.4-5.3 5.5-5.3s5.5 2.2 5.5 5.3"/><circle cx="17" cy="9.5" r="2.4"/><path d="M15.8 14.3c2.5.3 4.4 2.2 4.4 5"/></svg><span>AI팀</span></a>
  <a href="#coin" data-v="coin"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M10 7.5v9M12.5 7.5v1.2M12.5 15.3v1.2M9 9h4.2a1.8 1.8 0 0 1 0 3.6H9h4.6a1.9 1.9 0 0 1 0 3.8H9"/></svg><span>코인</span></a>
</nav>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = (v, d = 2) => Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  const usd = (v, d = 2) => (v < 0 ? '−$' : '$') + fmt(v, d);
  const sgnUsd = (v, d = 2) => (v >= 0.005 ? '+$' : v <= -0.005 ? '−$' : '$') + fmt(v, d);
  const pct = (v, d = 2) => (v >= 0.00005 ? '+' : v <= -0.00005 ? '−' : '') + fmt(v * 100, d) + '%';
  const cls = (v) => (v >= 0.005 ? 'up' : v <= -0.005 ? 'down' : '');
  const rcls = (v) => (v >= 0.00005 ? 'up' : v <= -0.00005 ? 'down' : '');      // for returns shown by pct()
  const WD = ['일', '월', '화', '수', '목', '금', '토'];

    const ups = mk ? Object.keys(mk).filter((c) => mk[c].up) : null;
    const heldT = Object.keys(pos.trend || {}), heldS = Object.keys(pos.scalp || {});
    const sp = Object.entries(CV.spreads || {}).sort((a, b) => b[1].net - a[1].net)[0];
    const minE = cf.arbMinEdge || 0;
    const stop = !!br.stopNew;
    const items = [
      { k: 'trend', name: '코인 추세(1시간)', w: w.trend || 0, on: !stop,
        why: stop ? '손실 브레이크로 새 매매를 잠시 멈췄습니다.' : `${mk ? (ups.length ? `100시간 평균 위(상승 추세): ${ups.join('·')}. 이 코인이 20시간 신고가를 넘으면 삽니다.` : '모든 코인이 100시간 평균 아래(하락 추세)라 새 매수는 기다립니다.') : '100시간 평균 위에서 20시간 신고가를 넘으면 삽니다.'}${heldT.length ? ` 보유 중: ${heldT.join('·')}.` : ''}` },
      { k: 'scalp', name: '코인 초단타(1분)', w: w.scalp || 0, on: !stop,
        why: stop ? '손실 브레이크로 새 매매를 잠시 멈췄습니다.' : `15분 고점을 넘고 5분 새 ${((cf.scalp && cf.scalp.mom) || 0.003) * 100}% 넘게 오르면 짧게 사고팝니다.${heldS.length ? ` 보유 중: ${heldS.join('·')}.` : ''}` },
      { k: 'arb', name: '거래소 간 차익거래', w: null, on: !!sp && sp[1].net > minE,
        why: sp ? (sp[1].net > minE ? `${sp[0]} 가격 차이가 수수료를 빼고도 ${pct(sp[1].net, 2)}라 사고팔 수 있습니다.` : `수수료를 빼면 가장 큰 가격 차이가 ${pct(sp[1].net, 2)}(${sp[0]})라 기다립니다. 기준은 +${fmt(minE * 100, 2)}%입니다.`) : '거래소 호가를 기다리는 중입니다.' },
    ];
    items.sort((a, b) => (b.on - a.on) || ((b.w == null ? -1 : b.w) - (a.w == null ? -1 : a.w)));
    let r = 0;
    return `<h3 class="sub-h">코인 계좌</h3><ol class="prio">` + items.map((it) => `<li class="${it.on ? '' : 'off'}"><span class="rk">${it.on ? ++r + '순위' : '대기'}</span><div class="bd"><b>${esc(it.name)}${it.on && it.w != null ? `<span class="tag">AI 위험 배분 ${Math.round(it.w * 100)}%</span>` : ''}</b><p>${esc(it.why)}</p></div></li>`).join('') + '</ol>';
  }
  function prioHTML() {
    const mc = S.macro;
    if (!mc) return '';
    let h = `<div class="band"></div><h2>지금 우선할 매매</h2><div class="mac"><p class="mac-head">${esc(mc.headline)}</p><span class="mac-sub">${md(mc.date)} 종가 기준 · AI가 실제로 위험을 싣는 순서입니다</span></div>`;
    h += `${hasCoin() ? '<h3 class="sub-h">주식·채권 계좌</h3>' : ''}<ol class="prio">` + mc.items.map((it) => `<li class="${it.on ? '' : 'off'}"><span class="rk">${it.on ? it.rank + '순위' : '쉼'}</span><div class="bd"><b>${esc(it.name)}${it.on ? `<span class="tag">AI 위험 배분 ${Math.round(it.budget * 100)}%</span>` : ''}</b><p>${esc(it.why)}</p></div></li>`).join('')
      + (S.account.hedge ? `<li><span class="rk">헷지</span><div class="bd"><b>S&amp;P 500 인버스</b><p>하락 추세에서 들고 있는 주식의 위험을 줄이려고 보유 중입니다.</p></div></li>` : '') + '</ol>';

    h += `<h3 class="sub-h">매크로 지표</h3><div class="sig">${mc.signals.map((g) => `<div><span>${esc(g.k)}</span><b class="${g.c || ''}">${esc(g.v)}</b><small>${esc(g.sub)}</small></div>`).join('')}</div>`;
    h += `<p class="sumline" style="padding-top:12px">판단 기준: S&amp;P 500이 200일선 아래면 돌파·눌림목 새 매수를 쉽니다. 방법별 위험 배분은 20거래일마다 최근 120거래일 성과로 다시 정합니다. 채권은 가격이 100일 평균 위이고 3개월 수익이 플러스일 때만 삽니다. 변동성과 금리는 지금 국면을 설명하는 참고 지표로, 매매 규칙을 직접 바꾸지는 않습니다. 금리 방향은 3개월 0.25%p 이상 움직였을 때 하락·상승으로 봅니다.</p>`;
    return h;
  }
  function arcPath(c, r0, r1, a0, a1) {
    const p = (r, a) => `${(c + r * Math.sin(a)).toFixed(2)} ${(c - r * Math.cos(a)).toFixed(2)}`;
    const big = a1 - a0 > Math.PI ? 1 : 0;
    return `M${p(r1, a0)}A${r1} ${r1} 0 ${big} 1 ${p(r1, a1)}L${p(r0, a1)}A${r0} ${r0} 0 ${big} 0 ${p(r0, a0)}Z`;
  }
  const allocCenter = (x, total) => (x ? `<span>${esc(x.name)}</span><b>${usd(x.v, 0)}</b><span>${fmt(x.share * 100, 1)}%</span>` : `<span>총 자산</span><b>${usd(total, 0)}</b>`);
  function allocHTML() {
    const { segs, total } = allocation();
    if (!segs.length || total <= 0) return '<p class="empty-row">보유 자산이 없습니다.</p>';
    const C = 84, R1 = 82, R0 = 56, gap = 2 / ((R0 + R1) / 2), TAU = Math.PI * 2;
    let a0 = 0;
    const paths = segs.map((x, i) => {
      const span = x.share * TAU, a1 = a0 + span;
      let d;
      if (span >= TAU - 1e-6) d = arcPath(C, R0, R1, 0, Math.PI) + arcPath(C, R0, R1, Math.PI, TAU);
      else { const g = Math.min(gap, span * 0.4); d = arcPath(C, R0, R1, a0 + g / 2, a1 - g / 2); }
      a0 = a1;
      return `<path data-i="${i}" d="${d}" style="fill:${x.col}"><title>${esc(x.name)} ${fmt(x.share * 100, 1)}%</title></path>`;
    }).join('');
    return `<div class="alloc"><div class="donut"><svg viewBox="0 0 168 168" role="img" aria-label="포트폴리오 구성: ${esc(segs.map((x) => `${x.name} ${fmt(x.share * 100, 1)}%`).join(', '))}">${paths}</svg><div class="c">${allocCenter(null, total)}</div></div>
      <ul>${segs.map((x, i) => `<li><button type="button" data-i="${i}" aria-pressed="false" aria-label="${esc(`${x.name} ${usd(x.v, 0)}, ${fmt(x.share * 100, 1)}%`)}"><i class="sw" style="background:${x.col}"></i><span class="nm">${esc(x.name)}</span><span class="sh">${fmt(x.share * 100, 1)}%</span></button></li>`).join('')}</ul></div>`;
  }
  function wireAlloc() {
    const box = document.querySelector('#v-account .alloc');
    if (!box) return;
    const { segs, total } = allocation();
    const svg = box.querySelector('svg'), c = box.querySelector('.c');
    let sel = -1;
    const pickSeg = (i) => {
      sel = sel === i ? -1 : i;
      svg.classList.toggle('sel', sel >= 0);
      svg.querySelectorAll('path').forEach((p) => p.classList.toggle('on', +p.dataset.i === sel));
      box.querySelectorAll('li button').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.i === sel)));
      c.innerHTML = allocCenter(segs[sel] || null, total);
    };
    svg.querySelectorAll('path').forEach((p) => p.addEventListener('click', () => pickSeg(+p.dataset.i)));
    box.querySelectorAll('li button').forEach((b) => b.addEventListener('click', () => pickSeg(+b.dataset.i)));
  }

    h += teamBlock(T.risk, '시장이 하락 추세면 새 매수를 멈추고, 다음 날로 넘기는 주식이 있으면 S&amp;P 500 인버스로 하락에 대비합니다. 낙폭과 연패가 커지면 1회 위험을 줄입니다.',
      `<ul class="mix" style="padding-top:10px"><li><span class="name">시장</span><span class="pnl ${g && g.ok ? '' : 'down'}">${g && g.ok ? '매수 가능' : '새 매수 멈춤'}</span><span class="stat">${esc(T.risk.regime ? T.risk.regime.text : '')}${g ? ` · S&amp;P 500 ${g.spx.toLocaleString('en-US')} (200일 평균 ${g.spx200.toLocaleString('en-US')})` : ''}</span></li>
        <li><span class="name">헷지</span><span class="pnl">${hg ? usd(hg.value) : '없음'}</span><span class="stat">${hg ? `${dLabel(hg.since)}부터, 보유 주식의 ${Math.round((hg.ratio || 0) * 100)}%` : '다음 날로 넘기는 주식이 없거나 시장이 상승 추세일 때는 헷지하지 않습니다'}</span></li>
        <li><span class="name">손실 브레이크</span><span class="pnl">${rk.mult < 1 || (rk.blocked || []).length ? '작동 중' : '정상'}</span>${(rk.why || []).concat(rk.blocked || []).length ? `<span class="stat">${esc((rk.why || []).concat(rk.blocked || []).join(' '))}</span>` : ''}</li></ul>`);
    $('v-team').innerHTML = h;
  }

  const SNAME = { arb: '거래소 간 차익거래', trend: '추세(1시간)', scalp: '초단타(1분)', move: '거래소 간 코인 이동' };
  const VN = (k) => (CV && CV.venues && CV.venues[k] ? CV.venues[k].name : k);
  const etTime = (ms) => new Intl.DateTimeFormat('ko-KR', { timeZone: 'America/New_York', month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit' }).format(new Date(ms));
  function coinSeries() {
    const pts = (CV.eqMin || []).map(([t, e]) => ({ label: etTime(t), v: e }));
    pts.push({ label: '지금', v: cryptoLive() });
    return { pts, base: pts.length ? pts[0].v : CV.funded };
  }
  function drawCoinChart() {
    const el = document.querySelector('#v-coin .chart');
    if (!el || !funded()) return;
    const { pts, base } = coinSeries(), W = Math.floor(el.clientWidth), H = Math.floor(el.clientHeight);
    if (!W || !H) return;
    const setHero = (i) => { $('coinValue').textContent = usd(pts[i].v); const d = pts[i].v - base; $('coinChange').innerHTML = `<span class="${cls(d)}">${sgnUsd(d)} (${pct(base ? d / base : 0)})</span><span class="when">${esc(i === pts.length - 1 ? '24시간' : pts[i].label)}</span>`; };
    setHero(pts.length - 1);
    if (pts.length < 2) { el.innerHTML = '<div class="empty">기록이 쌓이면 그래프가 그려집니다</div>'; return; }
    let lo = Math.min(base, ...pts.map((x) => x.v)), hi = Math.max(base, ...pts.map((x) => x.v));
    const padV = (hi - lo) * 0.12 || Math.max(1, hi * 0.0005); lo -= padV; hi += padV;
    const L = 20, R = 20, T = 12, B = 12, end = pts.length - 1;
    const x = (i) => L + (i / end) * (W - L - R), y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
    const col = pts[end].v >= base ? 'var(--up)' : 'var(--down)';
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true" focusable="false"><line x1="${L}" x2="${W - R}" y1="${y(base).toFixed(1)}" y2="${y(base).toFixed(1)}" stroke-width="1.2" stroke-dasharray="2 5" style="stroke:var(--muted)"/>
      <path d="${pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join('')}" fill="none" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" style="stroke:${col}"/>
      <line class="cur" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke-width="1" style="stroke:var(--muted);display:none"/><circle class="dot" cx="${x(end).toFixed(1)}" cy="${y(pts[end].v).toFixed(1)}" r="5" stroke-width="2.5" style="fill:${col};stroke:var(--bg)"/></svg>`;
    el.setAttribute('role', 'img');
    el.setAttribute('aria-label', `코인 계좌 24시간: ${usd(base)}에서 ${usd(pts[end].v)}`);
    const svg = el.querySelector('svg'), cur = svg.querySelector('.cur'), dot = svg.querySelector('.dot');
    const at = (cx) => { const r = svg.getBoundingClientRect(); const i = Math.max(0, Math.min(end, Math.round(((cx - r.left) / r.width * W - L) / (W - L - R) * end))); cur.setAttribute('x1', x(i)); cur.setAttribute('x2', x(i)); cur.style.display = ''; dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(pts[i].v)); setHero(i); };
    el.onpointerdown = (e) => at(e.clientX);
    el.onpointermove = (e) => { if (e.pointerType === 'mouse' || e.buttons) at(e.clientX); };
    el.onpointerleave = () => drawCoinChart();
    el.onpointerup = (e) => { if (e.pointerType !== 'mouse') drawCoinChart(); };
    el.onpointercancel = () => drawCoinChart();
  }
  function renderCoin() {
    const box = $('v-coin');
    if (!funded()) { box.innerHTML = '<p class="empty-row">코인 계좌는 주식 계좌에서 첫 자금이 들어오면 24시간 매매를 시작합니다.</p>'; return; }
    const st = CV.stats || {}, w = CV.w || {}, br = CV.brake || {};
    let h = `<div class="hero"><div class="hero-label">코인 계좌<span class="badge${wsOk ? ' on' : ''}" id="coinBadge"><i></i>${wsOk ? '실시간 시세' : '시세 연결 중'}</span></div><div class="hero-value num" id="coinValue">${usd(cryptoLive())}</div><div class="hero-change num" id="coinChange"></div></div><div class="chart"></div>`;
    const pnl = cryptoLive() - CV.funded;
    h += kv([['받은 자금', usd(CV.funded)], ['손익', sgnUsd(pnl), cls(pnl)], ['현금', usd(CV.usd)], ['코인 평가액', `<span id="coinHold">${usd(cryptoLive() - CV.usd)}</span>`]]);
    if (br.stopNew || br.half < 1) h += `<p class="note"><i aria-hidden="true"></i><span>${br.stopNew ? '손실 브레이크: 새 매매를 잠시 멈췄습니다' : '손실 브레이크: 위험을 절반으로 줄였습니다'} (오늘 ${pct(-(br.dayLoss || 0))}, 고점 대비 ${pct(-(br.dd || 0))})</span></p>`;
    h += `<div class="band"></div><h2>보유 코인</h2><ul class="list">` + ((CV.hold || []).length ? CV.hold.map((x) => `<li><div class="row"><span class="l"><b>${esc(x.c)}</b><span>${fmt(x.qty, 6)}개</span></span>
      <span class="r"><b data-coinv="${esc(x.c)}">${usd(x.qty * coinPx(x.c))}</b><span class="muted" data-coinp="${esc(x.c)}">${usd(coinPx(x.c))}</span></span></div></li>`).join('') : '<li><p class="empty-row">보유 코인이 없습니다.</p></li>') + '</ul>';
    h += `<div class="band"></div><h2>전략별 성과</h2><ul class="mix" style="padding-top:6px">` + ['arb', 'trend', 'scalp', 'moves'].map((k) => { const x = st[k] || { n: 0, pnl: 0, fees: 0 }, nm = k === 'moves' ? SNAME.move : SNAME[k];
      return `<li><span class="name">${nm}</span><span class="pnl ${k === 'moves' ? '' : cls(x.pnl)}">${k === 'moves' ? (x.fees > 0 ? '−' : '') + usd(x.fees) : sgnUsd(x.pnl)}</span><span class="stat">${k === 'moves' ? `${x.n}번 이동 · 네트워크 수수료` : `${x.n}건 · 수수료 ${usd(x.fees)}`}${k === 'trend' || k === 'scalp' ? ` · AI 위험 배분 ${Math.round((w[k] || 0) * 100)}%` : ''}</span></li>`; }).join('') + '</ul>';
    const sp = CV.spreads || {};
    h += `<div class="band"></div><h2>거래소 간 가격 차이</h2><p class="sumline">가장 싸게 사서 가장 비싸게 팔 수 있는 조합입니다. 수수료를 빼고도 +${fmt((CV.cfg.arbMinEdge || 0) * 100, 2)}%를 넘으면 차익거래를 합니다.</p><ul class="mix" style="padding-top:10px">` + Object.keys(sp).map((c) => { const x = sp[c];
      return `<li><span class="name">${esc(c)}</span><span class="pnl ${x.net > 0 ? 'up' : ''}">${pct(x.net, 2)}</span><span class="stat">${esc(VN(x.buyAt))}에서 사서 ${esc(VN(x.sellAt))}에 팔면 수수료 전 ${pct(x.gross, 3)}, 수수료 후 ${pct(x.net, 2)}</span></li>`; }).join('') + '</ul>';
    const fl = (CV.fills || []).slice(0, 15);
    h += `<div class="band"></div><h2>최근 체결</h2><ul class="list">` + (fl.length ? fl.map((f) => {
      const sideTxt = f.side === 'arb' ? '차익' : f.side === 'move' ? '이동' : f.side === 'buy' ? '매수' : '매도', sideCls = f.side === 'sell' ? 'sell' : f.side === 'buy' ? 'buy' : '';
      const sub = f.side === 'arb' ? `${esc(VN(f.buyAt))} → ${esc(VN(f.sellAt))}` : f.side === 'move' ? `${esc(VN(f.from))} → ${esc(VN(f.to))}` : `${fmt(f.qty, 6)}개 · ${usd(f.px)}`;
      const right = f.pnl != null ? `<b class="${cls(f.pnl)}">${sgnUsd(f.pnl)}</b>` : f.side === 'move' ? `<b>−${usd(f.fee)}</b>` : `<b>${usd(f.qty * f.px)}</b>`;
      const rows = f.side === 'arb' ? [['방법', SNAME.arb], ['수량', `${fmt(f.qty, 6)}개`], ['산 곳', `${esc(VN(f.buyAt))} ${usd(f.buy)}`], ['판 곳', `${esc(VN(f.sellAt))} ${usd(f.sell)}`], ['수수료 뺀 가격 차이', pct(f.edge || 0, 2)], ['수수료', usd(f.fee || 0)], ['손익', sgnUsd(f.pnl)]]
        : f.side === 'move' ? [['방법', SNAME.move], ['수량', `${fmt(f.qty, 6)}개`], ['보낸 곳 → 받은 곳', `${esc(VN(f.from))} → ${esc(VN(f.to))}`], ['네트워크 수수료', usd(f.fee || 0)]]
        : [['방법', SNAME[f.s] || f.s], ['체결가', usd(f.px)], ['수량', `${fmt(f.qty, 6)}개`], ['체결 금액', usd(f.qty * f.px)], ['수수료', usd(f.fee || 0)], f.why ? ['이유', esc(f.why)] : null, f.pnl != null ? ['손익', sgnUsd(f.pnl)] : null];
      return `<li><details><summary class="row"><span class="side ${sideCls}">${sideTxt}</span><span class="l"><b>${esc(f.c)}<span class="tag">${esc(SNAME[f.s] || f.s)}</span></b><span>${sub}</span></span><span class="r">${right}<span class="muted">${esc(etTime(f.t))}</span></span></summary>${more(rows)}</details></li>`;
    }).join('') : '<li><p class="empty-row">아직 체결이 없습니다.</p></li>') + '</ul>';
    const vs = CV.venues || {};
    h += `<details class="teamlog"><summary>거래소별 잔고</summary>${Object.keys(vs).map((k) => { const v = vs[k]; return `<div class="logitem"><b>${esc(v.name)} · 수수료 ${fmt(v.taker * 100, 2)}%</b><p>달러 ${usd(v.usd)} · ${Object.entries(v.coin).map(([c, q]) => `${esc(c)} ${fmt(q, 5)}`).join(' · ')}</p></div>`; }).join('')}${CV.trade ? `<div class="logitem"><b>${esc(CV.trade.venue)} · 추세·초단타용</b><p>달러 ${usd(CV.trade.usd)} · ${Object.entries(CV.trade.coin).map(([c, q]) => `${esc(c)} ${fmt(q, 5)}`).join(' · ')}</p></div>` : ''}</details>`;
    h += `<details class="teamlog"><summary>AI 기록 ${(CV.log || []).length}건</summary>${(CV.log || []).map((l) => `<div class="logitem"><span class="d">${esc(etTime(l.t))}</span><p>${esc(l.text)}</p></div>`).join('') || '<div class="logitem"><p>아직 기록이 없습니다.</p></div>'}</details>`;
    h += `<footer>가상 계좌입니다. 실제 돈이 아니며 투자 권유가 아닙니다. 서버가 약 15초마다 Coinbase·Kraken·Bitstamp·Gemini·Binance.US의 공개 호가(최우선 매수·매도 호가)를 받아 매매를 판단하고, 2분마다 저장합니다. 화면의 코인 가격은 Coinbase 공개 실시간 시세로 바로 바뀝니다. 수수료(시장가 기준, 2026-11-18 확인): Coinbase 0.90%, Kraken 0.80%, Bitstamp 0.40%, Gemini 1.20%, Binance.US 0.02%. 체결은 받은 호가보다 0.02% 불리하게 잡았습니다. 실제 차익거래 로봇은 1초보다 빠르게 움직여, 15초 간격으로는 잡을 수 없는 기회가 많고 실제 체결은 더 나쁠 수 있습니다. 거래소 간 코인 이동은 네트워크 수수료(BTC 0.0002, ETH 0.002, SOL 0.01, 확인필요)를 내고 바로 도착한다고 가정했습니다.</footer>`;
    box.innerHTML = h;
    drawCoinChart();
  }
  // live prices: a light update of the coin numbers and the account total, at most once a second
  let tickT = 0;
  const idle = (sel) => { const c = document.querySelector(sel + ' .chart .cur'); return !c || c.style.display === 'none'; };
  function tick() {
    const now = Date.now(), wait = 1000 - (now - lastTick);
    if (wait > 0) { if (!tickT) tickT = setTimeout(() => { tickT = 0; tick(); }, wait); return; }
    if (document.visibilityState !== 'visible' || !S || !S.account) return;
    lastTick = now;
    const v = (location.hash || '#account').slice(1);
    if (v === 'coin' && funded()) {
      if ($('coinValue') && idle('#v-coin')) drawCoinChart();
      document.querySelectorAll('[data-coinv]').forEach((b) => { const c = b.dataset.coinv, h = (CV.hold || []).find((x) => x.c === c); if (h) b.textContent = usd(h.qty * coinPx(c)); });
      document.querySelectorAll('[data-coinp]').forEach((b) => { b.textContent = usd(coinPx(b.dataset.coinp)); });
      if ($('coinHold')) $('coinHold').textContent = usd(cryptoLive() - CV.usd);
    }
    if (v === 'account' && funded()) {
      if ($('kvCoin')) $('kvCoin').textContent = usd(coinTotal());
      const t = totalNow(), put = (id, d) => { const b = $(id); if (b) { b.textContent = sgnUsd(d); b.className = cls(d); } };
      put('kvDay', t - acctPrev); put('kvAll', t - S.capital);
      if (idle('#v-account')) drawChart();
    }
  }
  function startWS() {
    if (ws || !funded() || typeof WebSocket === 'undefined') return;
    try {
      ws = new WebSocket('wss://ws-feed.exchange.coinbase.com');
      ws.onopen = () => { wsOk = true; ws.send(JSON.stringify({ type: 'subscribe', product_ids: (CV.cfg.coins || ['BTC', 'ETH', 'SOL']).map((c) => c + '-USD'), channels: ['ticker'] })); const b = $('coinBadge'); if (b) { b.className = 'badge on'; b.lastChild.textContent = '실시간 시세'; } };
      ws.onmessage = (e) => { try { const m = JSON.parse(e.data); if (m.type === 'ticker' && m.product_id && +m.price > 0) { live[m.product_id.split('-')[0]] = +m.price; tick(); } } catch (x) { /* ignore */ } };
      ws.onclose = () => { ws = null; wsOk = false; setTimeout(() => { if (document.visibilityState === 'visible') startWS(); }, 5000); };
      ws.onerror = () => { try { ws.close(); } catch (x) { /* closed */ } };
    } catch (e) { ws = null; }
  }

  function render() {
    renderAccount();
    renderFills();
    renderProfit();
    renderTeam();
    renderCoin();
    if ($('loading')) $('loading').remove();
    setLive();
    showView();
  }

  // ── data: the newest account file straight from the repository, the published copy as the fallback
  const RAW = (() => {
    const m = /^([^.]+)\.github\.io$/.exec(location.hostname), repo = location.pathname.split('/').filter(Boolean)[0];
    return m && repo ? `https://raw.githubusercontent.com/${m[1]}/${repo}/main/data/state.json` : null;
  })();
  async function load() {
    if (RAW) {
      try { const r = await fetch(RAW + '?ts=' + Date.now(), { cache: 'no-store' }); if (r.ok) return await r.json(); } catch (e) { /* fall back */ }
    }
    const r = await fetch('data/state.json?ts=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('계좌 파일을 받지 못했습니다 (' + r.status + ')');
    return r.json();
  }
  const RAWC = RAW ? RAW.replace(/state\.json$/, 'crypto/view.json') : null;
  async function loadCrypto() {
    for (const u of [RAWC, 'data/crypto/view.json'].filter(Boolean)) {
      try { const r = await fetch(u + '?ts=' + Date.now(), { cache: 'no-store' }); if (r.ok) { const v = await r.json(); if (v && v.v) return v; } } catch (e) { /* next */ }
    }
    return null;
  }
  async function refresh() {
    try {
      const st = await load();
      if (!S || st.built !== S.built) { S = st; render(); } else setLive();
    } catch (e) { /* keep the last good state */ }
  }
  async function refreshCrypto() {
    const v = await loadCrypto();
    if (v && (!CV || v.at !== CV.at)) { CV = v; if (S) { renderCoin(); renderAccount(); renderProfit(); showView(); } }
    startWS();
  }
  async function main() {
    showView();
    try { const [st, cv] = await Promise.all([load(), loadCrypto()]); CV = cv; S = st; render(); startWS(); }
    catch (err) { $('loading').textContent = '불러오지 못했습니다: ' + (err.message || err) + ' 잠시 뒤 새로 고침해 주세요.'; }
    setInterval(() => { if (document.visibilityState === 'visible') refresh(); }, 60000);
    setInterval(() => { if (document.visibilityState === 'visible') refreshCrypto(); }, 20000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { refresh(); refreshCrypto(); } });
  }
  main();
})();
</script>
</body>
