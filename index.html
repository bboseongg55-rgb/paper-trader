<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="연습장">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>자동매매 연습장</title>
<style>
/* design-five · 골격: 증권 앱(하단 탭 3개: 계좌·체결내역·수익) · 톤: 실용 · 기준색: 흰 바탕 + 잉크, 상승 빨강·하락 파랑 */
/* layout: one screen per tab; a big number on top, a line chart you can scrub, then plain lists separated by grey bands */
/* Pretendard (SIL OFL 1.1) subset: only used where the device has no Apple system font */
@font-face {
  font-family: "Pretendard Sub";
  src: url("fonts/pretendard-ks.woff2") format("woff2");
  font-weight: 45 920;
  font-style: normal;
  font-display: swap;
}
:root {
  --bg: #ffffff;
  --band: #f2f4f6;
  --ink: #191f28;
  --sub: #4e5968;
  --muted: #6b7684;
  --line: #e5e8eb;
  --up: #e0242f;
  --down: #1b64da;
  --up-soft: rgba(224, 36, 47, 0.1);
  --down-soft: rgba(27, 100, 218, 0.1);
  --ok: #128a4a;
  --warn: #b25000;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Pretendard Sub", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  /* chart series: indexes and portfolio parts (categorical order, never by rank of value) */
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s-other: #8b95a1; --s-cash: #d1d6db;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121214; --band: #1c1c20; --ink: #f2f3f5; --sub: #c3c9d0; --muted: #8b95a1; --line: #2a2a30;
    --up: #ff5c62; --down: #5b9bff; --up-soft: rgba(255, 92, 98, 0.16); --down-soft: rgba(91, 155, 255, 0.16);
    --ok: #3ccf7c; --warn: #ffb340; color-scheme: dark;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s-other: #6b7684; --s-cash: #3a3f46;
  }
}
:root[data-theme="dark"] {
  --bg: #121214; --band: #1c1c20; --ink: #f2f3f5; --sub: #c3c9d0; --muted: #8b95a1; --line: #2a2a30;
  --up: #ff5c62; --down: #5b9bff; --up-soft: rgba(255, 92, 98, 0.16); --down-soft: rgba(91, 155, 255, 0.16);
  --ok: #3ccf7c; --warn: #ffb340; color-scheme: dark;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s-other: #6b7684; --s-cash: #3a3f46;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); overflow-x: clip; }
body {
  font-family: var(--font); font-size: 17px; line-height: 1.5; word-break: keep-all; overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; -webkit-text-size-adjust: 100%;
  padding-bottom: calc(72px + env(safe-area-inset-bottom));
}
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); } .muted { color: var(--muted); }
.wrap { max-width: 640px; margin: 0 auto; }

/* status words use their own colours; red and blue are only for prices going up or down */
.warn { color: var(--warn); } .ok { color: var(--ok); }
.tag.ok { color: var(--ok); } .tag.warn { color: var(--warn); }
/* loading: the shape of the screen first */
.sk-wrap { padding: 6px 20px 0; }
.sk { background: var(--band); border-radius: 8px; animation: sk 1.4s ease-in-out infinite; }
@keyframes sk { 50% { opacity: 0.55; } }
@media (prefers-reduced-motion: reduce) { .sk { animation: none; } }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* account sections: one column on a phone, two on a wide screen */
#v-account.on { display: flex; flex-direction: column; }
#v-account .col-a, #v-account .col-b { display: contents; }
.sec-hero { order: 1; } .sec-ai { order: 2; } .sec-hold { order: 3; } .sec-ring { order: 4; } .sec-risk { order: 5; } .sec-fills { order: 6; }
.grp span { font-weight: 500; margin-left: 6px; }
/* AI summary card on the account screen */
.aisum { margin: 4px 20px 0; padding: 16px; border-radius: 14px; background: var(--band); display: grid; gap: 10px; }
.aisum .h { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.45; word-break: keep-all; }
.aisum ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.aisum li { display: flex; gap: 10px; align-items: baseline; font-size: 16px; }
.aisum li i { flex: none; font-style: normal; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.aisum a { font-size: 15px; font-weight: 600; color: var(--sub); text-decoration: none; }
/* risk: exposure by holding, long to the right, short to the left of a centre line */
.expo { list-style: none; margin: 0; padding: 12px 20px 0; display: grid; gap: 12px; }
.expo li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; }
.expo .nm { font-size: 16px; font-weight: 600; min-width: 0; word-break: keep-all; }
.expo .v { font-size: 16px; font-variant-numeric: tabular-nums; color: var(--sub); white-space: nowrap; }
.expo .bar { grid-column: 1 / -1; position: relative; height: 8px; border-radius: 4px; background: var(--band); }
.expo .bar::before { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--line); }
.expo .bar b { position: absolute; top: 0; bottom: 0; border-radius: 4px; background: var(--sub); }
.expo .sb { grid-column: 1 / -1; font-size: 15px; color: var(--muted); line-height: 1.5; word-break: keep-all; }
footer details.fine { margin-top: 8px; }
footer details.fine > summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; min-height: 44px; font-weight: 600; color: var(--sub); }
footer details.fine > summary::-webkit-details-marker { display: none; }
footer details.fine > summary::after { content: ' 보기'; font-weight: 500; color: var(--muted); }
footer details.fine[open] > summary::after { content: ' 접기'; }
footer details.fine p { margin: 0; }
/* performance metrics and the month grid */
.months { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 12px 20px 0; }
.months div { border-radius: 10px; padding: 10px 12px; background: var(--band); display: grid; gap: 2px; min-width: 0; }
.months span { font-size: 15px; color: var(--muted); }
.months b { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.months .pos { background: var(--up-soft); } .months .neg { background: var(--down-soft); }
.yr { margin: 16px 20px 0; font-size: 15px; font-weight: 700; color: var(--muted); }
/* folded sections on the AI screen */
details.fold { border-top: 12px solid var(--band); }
details.fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 18px 20px; min-height: 64px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary b { flex: 1; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
details.fold > summary span { font-size: 15px; color: var(--muted); }
details.fold > summary::after { content: ""; flex: none; width: 9px; height: 9px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg) translateY(-3px); transition: transform 200ms var(--ease-out); }
details.fold[open] > summary::after { transform: rotate(-135deg) translateY(-1px); }
details.fold > summary:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
@media (prefers-reduced-motion: reduce) { details.fold > summary::after { transition: none; } }
/* a wide screen: the account in two columns, reading screens kept narrow */
@media (min-width: 1024px) {
  .wrap { max-width: 1160px; }
  #v-account.on { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 0 40px; align-items: start; }
  #v-account .col-a, #v-account .col-b { display: block; min-width: 0; }
  #v-account .col-b > div:first-child > .band:first-child { display: none; }
  #v-fills.on, #v-profit.on, #v-team.on { max-width: 760px; margin: 0 auto; }
}

/* top bar */
.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(10px + env(safe-area-inset-top)) 20px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; color: var(--muted); min-width: 0; text-align: right; }
.live > span { min-width: 0; word-break: keep-all; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.live.on i { background: var(--ok); }

section.view { display: none; }
section.view.on { display: block; }
.pad { padding: 0 20px; }
.band { height: 12px; background: var(--band); margin: 24px 0 8px; }

/* the big number */
.hero { padding: 6px 20px 0; }
.hero-label { font-size: 15px; color: var(--sub); }
.hero-value { font-size: 40px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; margin-top: 2px; }
.hero-change { font-size: 17px; font-weight: 600; margin-top: 4px; min-height: 1.5em; }
.hero-change .when { color: var(--muted); font-weight: 500; margin-left: 6px; }

/* chart */
.chart .ctag { font-size: 15px; font-weight: 600; fill: var(--sub); }
.chart .cax { font-size: 15px; fill: var(--muted); }
.chart { position: relative; margin: 14px 0 0; height: 220px; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.chart svg { display: block; width: 100%; height: 100%; }
.chart .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 15px; }
.periods { display: flex; gap: 6px; padding: 10px 20px 0; }
.periods button { flex: 1; min-height: 40px; border: 0; border-radius: 10px; background: transparent; color: var(--sub); font-size: 15px; font-weight: 600; cursor: pointer; transition: transform 120ms var(--ease-out), background-color 150ms var(--ease-out); }
.periods button[aria-pressed="true"] { background: var(--band); color: var(--ink); }
.periods button:active { transform: scale(0.97); }
/* index comparison: chips turn index lines on, the chart then shows % change from the same start */
.cmp { display: flex; flex-wrap: nowrap; align-items: center; gap: 6px; padding: 12px 20px 2px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
.cmp::-webkit-scrollbar { display: none; }
.cmp button { flex: none; }
.cmp button[aria-disabled="true"] { opacity: 0.45; }
.cmp-note { padding: 6px 20px 0; font-size: 15px; color: var(--muted); }
.cmp-label { flex: none; font-size: 15px; font-weight: 600; color: var(--muted); margin-right: 2px; }
.cmp button { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border-radius: 20px; border: 1px solid var(--line); background: var(--bg); font-size: 15px; font-weight: 600; color: var(--sub); cursor: pointer; white-space: nowrap; transition: transform 120ms var(--ease-out), background-color 150ms var(--ease-out); }
.cmp button[aria-pressed="true"] { background: var(--band); border-color: var(--band); color: var(--ink); }
.cmp button[aria-pressed="false"] .key { opacity: 0.4; }
.cmp button:active { transform: scale(0.97); }
.key { flex: none; display: inline-block; width: 14px; height: 3px; border-radius: 2px; }
.legend { list-style: none; margin: 8px 20px 0; padding: 0; display: grid; gap: 4px; }
.legend[hidden] { display: none; }
.badge { display: inline-flex; align-items: center; gap: 5px; margin-left: 8px; font-size: 15px; font-weight: 600; color: var(--muted); }
.badge i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.badge.on i { background: var(--ok); }
.range { display: flex; align-items: flex-end; gap: 8px; padding: 10px 20px 0; }
.range[hidden] { display: none; }
.range label { flex: 1; min-width: 0; display: grid; gap: 4px; font-size: 15px; color: var(--muted); }
.range input { min-height: 44px; width: 100%; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font: inherit; font-size: 17px; }
.range .dash { padding-bottom: 10px; color: var(--muted); }
.legend li { display: flex; align-items: center; gap: 10px; font-size: 16px; min-height: 26px; }
.legend li span { flex: 1; min-width: 0; color: var(--sub); }
.legend li b { font-weight: 600; font-variant-numeric: tabular-nums; }
.legend .when { color: var(--muted); font-size: 15px; }
/* portfolio ring */
.alloc { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 16px; align-items: center; padding: 8px 20px 0; }
.donut { position: relative; width: 168px; height: 168px; }
.donut svg { display: block; width: 100%; height: 100%; }
.donut path { cursor: pointer; transition: opacity 150ms var(--ease-out); }
.donut svg.sel path:not(.on) { opacity: 0.3; }
.donut .c { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; text-align: center; pointer-events: none; padding: 0 34px; line-height: 1.3; }
.donut .c span { font-size: 15px; color: var(--muted); max-width: 100px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.donut .c b { font-size: 17px; font-weight: 700; }
.alloc ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; min-width: 0; }
.alloc li button { width: 100%; display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; align-items: center; gap: 8px; min-height: 36px; padding: 2px 8px; border: 0; border-radius: 8px; background: transparent; text-align: left; cursor: pointer; }
.alloc li button[aria-pressed="true"] { background: var(--band); }
.alloc .sw { width: 12px; height: 12px; border-radius: 3px; }
.alloc .nm { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.alloc .sh { font-size: 15px; font-variant-numeric: tabular-nums; color: var(--sub); }
.ain-box { margin: 12px 20px 0; }
.ain-hint { margin: 0; font-size: 15px; color: var(--muted); }
.ain-h { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; margin: 0 0 4px; }
.ain-h .sw { flex: none; width: 12px; height: 12px; border-radius: 3px; }
.ain-h b { font-size: 17px; font-weight: 700; }
.ain-h span { font-size: 15px; color: var(--sub); font-variant-numeric: tabular-nums; }
.ain { list-style: none; margin: 0; padding: 0; }
.ain li { border-bottom: 1px solid var(--line); }
.ain-r { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 60px; padding: 10px 0; color: inherit; text-decoration: none; }
a.ain-r::after, a.row::after { content: ""; flex: none; width: 8px; height: 8px; border-top: 2px solid var(--muted); border-right: 2px solid var(--muted); transform: rotate(45deg); margin-right: 2px; }
a.ain-r:active { background: var(--band); }
a.row { color: inherit; text-decoration: none; }
a.row:focus-visible, a.ain-r:focus-visible, .back:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; border-radius: 8px; }
/* a holding's own page: its chart with the average price as a dashed line */
.ast-bar { padding: 2px 8px 0; }
.back { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border-radius: 10px; color: var(--sub); font-size: 16px; font-weight: 600; text-decoration: none; }
.back::before { content: ""; width: 9px; height: 9px; border-left: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); }
.back:active { background: var(--band); }
.hero-label .tag { margin-left: 8px; vertical-align: 1px; }
.chart.achart { height: 260px; }
.achart .ref { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 6 5; opacity: 0.75; }
.achart .ref2 { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 2 4; }
.achart .rl { font-size: 15px; font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
.achart .rl2 { font-size: 15px; font-weight: 500; fill: var(--sub); paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
.achart .cax { font-size: 15px; fill: var(--muted); }
.asrc { margin: 0; padding: 8px 20px 0; font-size: 15px; color: var(--muted); }
.ainfo { padding: 2px 20px 0; }
.ainfo div { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.ainfo div:last-child { border-bottom: 0; }
.ainfo span { flex: none; font-size: 15px; color: var(--muted); }
.ainfo b { font-size: 16px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; word-break: keep-all; overflow-wrap: anywhere; }
.awhy { margin: 0; padding: 6px 20px 0; font-size: 16px; line-height: 1.6; color: var(--sub); word-break: keep-all; overflow-wrap: anywhere; }
.ain li:last-child { border-bottom: 0; }
.ain .l { display: grid; gap: 2px; min-width: 0; }
.ain .l b { font-size: 16px; font-weight: 600; word-break: keep-all; }
.ain .l span { font-size: 15px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ain .r { flex: none; display: grid; gap: 2px; justify-items: end; font-variant-numeric: tabular-nums; }
.ain .r b { font-size: 16px; font-weight: 600; }
.ain .r span { font-size: 15px; color: var(--muted); }
@media (max-width: 370px) { .alloc { grid-template-columns: minmax(0, 1fr); justify-items: center; } .alloc ul { width: 100%; } }

/* key numbers in two columns */
.kv { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px 16px; padding: 20px 20px 0; }
.kv div { display: grid; gap: 2px; min-width: 0; }
.kv > div > span { font-size: 15px; color: var(--muted); }
.kv b { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
.note { margin: 16px 20px 0; padding: 12px 14px; border-radius: 12px; background: var(--band); font-size: 15px; color: var(--sub); display: flex; gap: 10px; align-items: baseline; }
.note i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); transform: translateY(-1px); }

h2 { margin: 0; padding: 4px 20px 6px; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 8px; }
h2 .count { font-size: 17px; color: var(--muted); font-weight: 600; }
h3.day { margin: 0; padding: 18px 20px 4px; font-size: 15px; font-weight: 600; color: var(--muted); }

/* list rows; a tap opens the details */
ul.list { list-style: none; margin: 0; padding: 0; }
ul.list > li > details > summary { list-style: none; cursor: pointer; }
ul.list > li > details > summary::-webkit-details-marker { display: none; }
.row { display: flex; align-items: center; gap: 12px; padding: 14px 20px; min-height: 64px; }
.row:active { background: var(--band); }
.row .l { flex: 1; min-width: 0; display: grid; }
.row .l b { font-size: 17px; font-weight: 600; }
.row .l span { font-size: 15px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .r { text-align: right; display: grid; justify-items: end; }
.row .r b { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .r span { font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.side { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 700; }
.side.buy { background: var(--up-soft); color: var(--up); }
.side.sell { background: var(--down-soft); color: var(--down); }
.side:not(.buy):not(.sell) { background: var(--band); color: var(--sub); }
.more { margin: 0 20px 12px; padding: 12px 14px; border-radius: 12px; background: var(--band); display: grid; gap: 8px; font-size: 15px; }
.more div { display: flex; justify-content: space-between; gap: 12px; }
.more span { color: var(--muted); white-space: nowrap; }
.more b { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.tag { display: inline-block; font-size: 15px; font-weight: 600; line-height: 22px; padding: 0 7px; border-radius: 6px; background: var(--band); color: var(--sub); margin-left: 6px; vertical-align: middle; }
.empty-row { padding: 18px 20px; color: var(--muted); font-size: 16px; }
.mac { margin: 4px 20px 0; padding: 14px 16px; border-radius: 14px; background: var(--band); }
.mac-head { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.45; word-break: keep-all; overflow-wrap: anywhere; }
.mac-sub { display: block; margin-top: 6px; font-size: 15px; color: var(--muted); }
.prio { list-style: none; margin: 0; padding: 6px 0 0; }
.prio li { display: flex; gap: 12px; padding: 12px 20px; align-items: flex-start; }
.prio .rk { flex: none; min-width: 52px; height: 28px; padding: 0 8px; border-radius: 14px; display: grid; place-items: center; font-size: 15px; font-weight: 700; background: var(--ink); color: var(--bg); }
.prio li.off .rk { background: var(--band); color: var(--muted); }
.prio .bd { min-width: 0; display: grid; gap: 4px; }
.prio .bd b { font-size: 17px; font-weight: 600; }
.prio li.off .bd b { color: var(--sub); }
.prio .bd p { margin: 0; font-size: 15px; color: var(--sub); line-height: 1.5; word-break: keep-all; overflow-wrap: anywhere; }
.sub-h { margin: 14px 20px 0; font-size: 16px; font-weight: 700; color: var(--sub); }
.sig { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 12px 20px 0; }
.sig div { display: grid; gap: 2px; min-width: 0; }
.sig span { font-size: 15px; color: var(--muted); word-break: keep-all; }
.sig b { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
.sig small { font-size: 15px; color: var(--muted); line-height: 1.4; word-break: keep-all; }
.abar { list-style: none; margin: 0; padding: 12px 20px 0; display: grid; gap: 14px; }
.abar li { display: grid; gap: 6px; }
.abar .t { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; }
.abar .t b { font-weight: 600; min-width: 0; word-break: keep-all; }
.abar .t span { color: var(--sub); font-variant-numeric: tabular-nums; white-space: nowrap; }
.abar .track { position: relative; height: 10px; border-radius: 5px; background: var(--band); }
.abar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: var(--s1); }
.abar .goal { position: absolute; top: -4px; bottom: -4px; width: 3px; border-radius: 2px; background: var(--ink); }
.grp { margin: 16px 20px 0; font-size: 15px; font-weight: 700; color: var(--muted); }
.why { margin: -4px 20px 0; padding: 0 0 14px; font-size: 15px; color: var(--sub); line-height: 1.5; word-break: keep-all; overflow-wrap: anywhere; }
.why b { font-weight: 600; color: var(--ink); margin-right: 6px; }
@media (max-width: 350px) { .sig { grid-template-columns: minmax(0, 1fr); } }

.filters { display: flex; gap: 8px; padding: 12px 20px 0; }
.filters button { min-height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid var(--line); background: var(--bg); font-size: 15px; font-weight: 600; color: var(--sub); cursor: pointer; transition: transform 120ms var(--ease-out); }
.filters button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.filters button:active { transform: scale(0.97); }
.sumline { padding: 2px 20px 0; font-size: 15px; color: var(--muted); }

.mix { list-style: none; margin: 0; padding: 4px 20px 0; display: grid; gap: 14px; }
.mix li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; }
.mix .name { font-size: 17px; font-weight: 600; }
.mix .stat { font-size: 15px; color: var(--muted); grid-column: 1 / -1; }
.mix .pnl { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }

footer { margin: 28px 20px 8px; font-size: 15px; color: var(--muted); line-height: 1.6; }
.team-head { padding: 4px 20px 0; }
.team-head p { margin: 2px 0 0; font-size: 15px; color: var(--muted); }
.rules { list-style: none; margin: 10px 20px 0; padding: 12px 14px; border-radius: 12px; background: var(--band); display: grid; gap: 8px; font-size: 15px; }
.rules li { display: flex; justify-content: space-between; gap: 12px; }
.rules span { color: var(--muted); }
.rules b { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.rules b.changed::after { content: "조정됨"; margin-left: 6px; font-size: 14px; font-weight: 600; padding: 0 6px; border-radius: 6px; background: var(--up-soft); color: var(--up); vertical-align: 1px; }
details.teamlog { margin: 10px 20px 0; }
details.teamlog > summary { cursor: pointer; font-size: 15px; font-weight: 600; color: var(--sub); padding: 8px 0; list-style: none; }
details.teamlog > summary::-webkit-details-marker { display: none; }
details.teamlog > summary::after { content: " 보기"; color: var(--muted); font-weight: 500; }
details.teamlog[open] > summary::after { content: " 접기"; }
.logitem { padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
.logitem b { display: block; font-size: 16px; }
.logitem .d { color: var(--muted); font-size: 15px; }
.logitem p { margin: 4px 0 0; color: var(--sub); }
.flag { display: inline-block; font-size: 15px; font-weight: 600; line-height: 20px; padding: 0 7px; border-radius: 6px; margin-left: 6px; vertical-align: middle; background: var(--up-soft); color: var(--up); }
.flag.gray { background: var(--band); color: var(--sub); }

/* bottom tabs */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bg); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
}
.tabbar a { display: grid; justify-items: center; gap: 2px; padding: 6px 0; text-decoration: none; color: var(--muted); font-size: 14px; font-weight: 600; border-radius: 10px; }
.tabbar a svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar a[aria-current="page"] { color: var(--ink); }
.tabbar a:active { transform: scale(0.97); }

:focus-visible { outline: 3px solid var(--down); outline-offset: 2px; border-radius: 8px; }
.loading { padding: 80px 20px; text-align: center; color: var(--muted); }
.loading.sk-wrap { padding: 6px 20px 0; text-align: left; }
@media (min-width: 700px) { .tabbar { max-width: 640px; margin: 0 auto; border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }
@media (max-width: 350px) { .hero-value { font-size: 34px; } .kv { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { .periods button, .filters button, .cmp button, .donut path { transition: none; } .periods button:active, .filters button:active, .cmp button:active, .tabbar a:active { transform: none; } }

<nav class="tabbar" aria-label="화면">
  <a href="#account" data-v="account"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5h14a3 3 0 0 1 3 3v6.5a3 3 0 0 1-3 3h-11a3 3 0 0 1-3-3v-9.5z"/><path d="M3.5 7.5 15 4.5v3"/><circle cx="16.2" cy="13.8" r="1.1"/></svg><span>계좌</span></a>
  <a href="#fills" data-v="fills"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12v17l-3-2-3 2-3-2-3 2v-17z"/><path d="M9 8.5h6M9 12.5h6"/></svg><span>체결내역</span></a>
  <a href="#profit" data-v="profit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 17.5 9 12l4 4 7.5-7.5"/><path d="M15 8.5h5.5V14"/></svg><span>수익</span></a>
  <a href="#team" data-v="team"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8.5" r="3"/><path d="M3.5 19.5c0-3.1 2.4-5.3 5.5-5.3s5.5 2.2 5.5 5.3"/><circle cx="17" cy="9.5" r="2.4"/><path d="M15.8 14.3c2.5.3 4.4 2.2 4.4 5"/></svg><span>AI</span></a>
</nav>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = (v, d = 2) => Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  const usd = (v, d = 2) => (v < 0 ? '−$' : '$') + fmt(v, d);
  const sgnUsd = (v, d = 2) => (v >= 0.005 ? '+$' : v <= -0.005 ? '−$' : '$') + fmt(v, d);
  const pct = (v, d = 2) => (v >= 0.00005 ? '+' : v <= -0.00005 ? '−' : '') + fmt(v * 100, d) + '%';
  const cls = (v) => (v >= 0.005 ? 'up' : v <= -0.005 ? 'down' : '');
  const rcls = (v) => (v >= 0.00005 ? 'up' : v <= -0.00005 ? 'down' : '');      // for returns shown by pct()
  const WD = ['일', '월', '화', '수', '목', '금', '토'];
  const dLabel = (d) => `${+d.slice(5, 7)}월 ${+d.slice(8, 10)}일 (${WD[new Date(d + 'T12:00:00Z').getUTCDay()]})`;
  const PB = { bo: '돌파', pb: '눌림목', dt: '단타', bd: '채권', hedge: '헷지' };
  const PB_LONG = { bo: '신고가 돌파', pb: '추세 눌림목', dt: '당일 단타', bd: '채권 추세', hedge: 'S&P 500 인버스 헷지' };
  const VIEWS = ['account', 'fills', 'profit', 'team'];
  const TITLES = { account: '통합계좌', fills: '체결내역', profit: '수익', team: 'AI 운용' };
  const HOLIDAYS = ['2026-11-26', '2026-12-25', '2027-01-01', '2027-01-18', '2027-02-15', '2027-03-26', '2027-05-31', '2027-06-18', '2027-07-05', '2027-09-06', '2027-11-25', '2027-12-24'];
  const EARLY_CLOSE = ['2026-11-27', '2026-12-24', '2027-11-26'];
  let S = null, period = 'day', filter = 'all', range = null;

  function nyNow() {
    const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date()).map((x) => [x.type, x.value]));
    return { date: `${p.year}-${p.month}-${p.day}`, hm: `${p.hour}:${p.minute}` };
  }
  function marketOpen() {
    const n = nyNow(), wd = new Date(n.date + 'T12:00:00Z').getUTCDay();
    if (wd === 0 || wd === 6 || HOLIDAYS.includes(n.date)) return false;
    return n.hm >= '09:30' && n.hm < (EARLY_CLOSE.includes(n.date) ? '13:00' : '16:00');
  }
  const clock = (iso) => { try { return new Intl.DateTimeFormat('ko-KR', { timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit' }).format(new Date(iso)); } catch (e) { return ''; } };
  function setLive() {
    const on = marketOpen(), lq = Object.values(LQ).reduce((m, q) => Math.max(m, q.t || 0), 0), fresh = Date.now() - lq < 120e3;
    $('live').className = 'live' + (on || fresh || (funded() && wsOk) ? ' on' : '');
    $('live').lastElementChild.textContent = S ? `${on ? '장중' : '장 마감'}${fresh || wsOk ? ' · 실시간' : funded() ? ' · 코인 24시간' : ''} · ${clock(new Date(Math.max(lq, Date.parse(S.built) || 0)).toISOString())}` : '불러오는 중';
  }

  // ── tabs
  const viewKey = () => { const h = (location.hash || '#account').slice(1); return h.startsWith('a/') ? 'asset' : VIEWS.includes(h) ? h : 'account'; };
  function showView() {
    const v = viewKey();
    document.querySelectorAll('.tabbar a').forEach((a) => a.setAttribute('aria-current', a.dataset.v === (v === 'asset' ? 'account' : v) ? 'page' : 'false'));
    document.querySelectorAll('section.view').forEach((s) => s.classList.toggle('on', s.id === 'v-' + v));
    $('title').textContent = v === 'asset' ? (((S && assetOf(curAssetId())) || {}).short || ((S && assetOf(curAssetId())) || { title: '자산' }).title) : TITLES[v];
    if (v === 'account') drawChart();
    if (v === 'asset') renderAsset();
    setLive();
  }
  // a holding's page opened from the list goes back to the same place in the list
  let lastV = null, aBack = false;
  const scrollAt = {};
  window.addEventListener('hashchange', () => {
    const prev = lastV || 'account', v = viewKey();
    scrollAt[prev] = window.scrollY;
    aBack = v === 'asset' ? (prev !== 'asset' ? true : aBack) : false;
    showView();
    window.scrollTo(0, prev === 'asset' && v !== 'asset' && scrollAt[v] != null ? scrollAt[v] : 0);
    lastV = v;
  });

  // ── account value over the chosen period
  // ── the crypto account (its own file, saved every 2 minutes) and live prices from Coinbase's public feed
  let CV = null, ws = null, wsOk = false, lastTick = 0;
  const live = {};
  const funded = () => !!(CV && CV.funded > 0);
  const coinPx = (c) => (live[c] > 0 ? live[c] : CV && CV.last && CV.last[c] > 0 ? CV.last[c] : 0);
  const cryptoLive = () => (funded() ? CV.usd + (CV.hold || []).reduce((t, h) => t + h.qty * coinPx(h.c), 0) + (CV.toks || []).reduce((t, x) => t + (x.value || 0), 0) : 0);   // dollars, coins at live prices, tokens as last saved
  function cryptoAt(ms) {                 // the crypto account's value at a time (0 before its money arrived)
    if (!funded()) return 0;
    const pick = (list) => { let v = null; for (const [t, e] of list || []) { if (t <= ms) v = e; else break; } return v; };
    const m = CV.eqMin || [];
    const v = m.length && ms >= m[0][0] ? pick(m) : pick(CV.eqHour);
    return v == null ? 0 : v;
  }
  function etMs(d, hm) {                  // a New York date and HH:MM as a moment
    const [H, M] = String(hm || '16:00').split(':').map(Number);
    const guess = Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10), H + 5, M);
    const h = +new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour: 'numeric', hourCycle: 'h23' }).format(new Date(guess));
    return h === H ? guess : guess - 3600e3;
  }
  const rowMs = (e) => etMs(e.date, e.time || '16:00');
  const stockNow = () => { const a = S.account, l = a.equity[a.equity.length - 1]; return l.eq + (a.flowsAfter || 0) + (a.liveD || 0); };
  // money between the parts of the account: left the stock book but not yet in the 24-hour part, or the reverse
  const inTransit = () => { const got = new Set(((CV && CV.transfers) || []).map((t) => t.id)); return ((S && S.alloc && S.alloc.transfers) || []).reduce((x, t) => x + (t.to === 'crypto' && t.stockDone && !got.has(t.id) ? t.amount : t.from === 'crypto' && !t.stockDone && got.has(t.id) ? t.amount : 0), 0); };
  const derivNow = () => (S && S.deriv ? S.deriv.eq + (S.deriv.liveD || 0) : 0);
  function derivAt(date) {               // futures, options and ELS at a day's close (before that evening's money moves)
    const h = (S && S.deriv && S.deriv.hist) || [];
    let v = 0;
    for (const r of h) { if (r.date < date) v = r.eq; else { if (r.date === date) v = r.pre != null ? r.pre : r.eq; break; } }
    return v;
  }
  const hasCoin = () => funded() || inTransit() > 0 || derivNow() > 0;
  const coinTotal = () => cryptoLive() + inTransit();
  const totalNow = () => stockNow() + derivNow() + coinTotal();
  const otherAt = (e) => cryptoAt(rowMs(e)) + derivAt(e.date);   // the parts other than the stock book at a row's time
  const md = (d) => `${+d.slice(5, 7)}월 ${+d.slice(8, 10)}일`;
  const rowLabel = (e) => (e.prov ? `${dLabel(e.date)} ${e.time} 기준` : dLabel(e.date));
  const periodName = () => (period === 'custom' && range ? (range.from === range.to ? md(range.from) : `${md(range.from)}~${md(range.to)}`) : { day: '최근 거래일', week: '1주', month: '1개월', all: '시작 후' }[period]);
  // the account's closes in the chosen period, and the close just before it (none when the period starts on day one)
  function dailyWindow() {
    const eqs = S.account.equity;
    let i0 = 0, i1 = eqs.length - 1;
    if (period === 'day') i0 = Math.max(0, eqs.length - 1);
    else if (period === 'week' || period === 'month') i0 = Math.max(0, eqs.length - (period === 'week' ? 5 : 21));
    else if (period === 'custom' && range) {
      i0 = eqs.findIndex((e) => e.date >= range.from);
      i1 = -1;
      for (let i = eqs.length - 1; i >= 0; i--) if (eqs[i].date <= range.to) { i1 = i; break; }
    }
    if (i0 < 0 || i1 < i0) return null;
    return { rows: eqs.slice(i0, i1 + 1), before: i0 > 0 ? eqs[i0 - 1] : null };
  }
  function series() {
    const a = S.account, eqs = a.equity;
    const prevClose = eqs.length > 1 ? eqs[eqs.length - 2].eq : S.capital;
    const nowPt = (pts) => { if (hasCoin() && (period !== 'custom' || !range || range.to >= eqs[eqs.length - 1].date)) pts.push({ label: '지금', v: totalNow() }); return pts; };
    if (period === 'day') {
      const pts = (a.intraday || []).map((x) => ({ label: `${dLabel(S.asOf.date)} ${x.t}`, v: x.eq + (cryptoAt(etMs(S.asOf.date, x.t)) + derivAt(S.asOf.date)) }));
      const lastRow = eqs[eqs.length - 1];
      if (pts.length >= 2 && !S.asOf.prov && lastRow.date === S.asOf.date) pts.push({ label: `${dLabel(lastRow.date)} 종가`, v: lastRow.eq + otherAt(lastRow) });
      if (pts.length >= 2) return { pts: nowPt(pts), base: prevClose + (eqs.length > 1 ? otherAt(eqs[eqs.length - 2]) : 0), name: S.asOf.prov ? '오늘' : '최근 거래일' };
    }
    const w = dailyWindow();
    if (!w) return { pts: [], base: 0, name: periodName(), none: true };
    const pts = [w.before ? { label: `${dLabel(w.before.date)} 종가`, v: w.before.eq + otherAt(w.before) } : { label: '시작', v: S.capital }].concat(w.rows.map((e) => ({ label: rowLabel(e), v: e.eq + otherAt(e) })));
    return { pts: nowPt(pts), base: pts[0].v, name: periodName() };
  }
  function heroChange(v, base, when) {
    const d = v - base;
    return `<span class="${cls(d)}">${sgnUsd(d)} (${pct(base ? d / base : 0)})</span><span class="when">${esc(when)}</span>`;
  }
  // ── index comparison, like TradingView's compare: the account and each chosen index as % change from the same start
  // the indexes come with the data (indexes.js); each chosen index keeps its colour until it is turned off
  const SLOTS = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s6)', 'var(--s7)'], CMP_MAX = 4;
  const IDX = () => ((S && S.compare && S.compare.list) || [{ k: 'spx', name: 'S&P 500', chip: 'S&P 500' }, { k: 'ndx', name: '나스닥 100', chip: '나스닥 100' }, { k: 'dji', name: '다우존스', chip: '다우' }]);
  const loadLS = (key, d) => { try { const v = JSON.parse(localStorage.getItem(key) || 'null'); return v == null ? d : v; } catch (e) { return d; } };
  let cmp = (() => { const v = loadLS('cmp', []); return Array.isArray(v) ? v.slice(0, CMP_MAX) : []; })();
  let cmpCol = (() => { const v = loadLS('cmpCol', {}); return v && typeof v === 'object' && !Array.isArray(v) ? v : {}; })();
  const takeSlot = (k) => { const used = new Set(cmp.filter((x) => x !== k).map((x) => cmpCol[x])); let i = 0; while (used.has(i)) i++; cmpCol[k] = i; };
  cmp.forEach((k) => { if (cmpCol[k] == null) takeSlot(k); });
  const colOf = (k) => SLOTS[(cmpCol[k] || 0) % SLOTS.length];
  const saveCmp = () => { try { localStorage.setItem('cmp', JSON.stringify(cmp)); localStorage.setItem('cmpCol', JSON.stringify(cmpCol)); } catch (e) { /* storage off: keep it for this visit */ } };
  const hasIdx = (k) => { const C = S && S.compare; return !!C && ((C.daily || []).some((r) => r[k] != null) || (C.intraday || []).some((r) => r[k] != null)); };
  function cmpSeries(keys) {
    const a = S.account, C = S.compare || {}, eqs = a.equity;
    const pick = (row, k) => (row && row[k] != null ? row[k] : null);
    if (period === 'day') {

  // live prices: a light update of the coin numbers and the account total, at most once a second
  let tickT = 0;
  const idle = (sel) => { const c = document.querySelector(sel + ' .chart .cur'); return !c || c.style.display === 'none'; };
  function tick() {
    const now = Date.now(), wait = 1000 - (now - lastTick);
    if (wait > 0) { if (!tickT) tickT = setTimeout(() => { tickT = 0; tick(); }, wait); return; }
    if (document.visibilityState !== 'visible' || !S || !S.account) return;
    lastTick = now;
    const v = viewKey();
    if (v === 'account') {
      const M = new Map(assetList().map((x) => [x.id, x]));
      document.querySelectorAll('#v-account [data-lv]').forEach((el) => {
        const x = M.get(el.dataset.lv); if (!x) return;
        const b = el.querySelector('.r b'), sp = el.querySelector('.r span');
        if (b) { b.textContent = x.rb; b.className = x.rbC || ''; }
        if (sp) { sp.textContent = x.rs || ''; sp.className = x.rsC || ''; }
      });
      if ($('kvInv')) { const dv = S.deriv, cashAll = stockNow() - (S.account.open.reduce((t, p) => t + p.value, 0) + (S.account.hedge ? S.account.hedge.value : 0)) + (dv ? dv.cash - dv.margin - dv.optRisk : 0) + (funded() ? CV.usd : 0) + inTransit(); $('kvInv').textContent = usd(totalNow() - cashAll); }
      const t = totalNow(), set = (id, d) => { const b = $(id); if (b) { b.textContent = sgnUsd(d); b.className = cls(d); } };
      set('kvDay', t - acctPrev); set('kvAll', t - S.capital);
      if (idle('#v-account')) drawChart();
    } else if (v === 'asset') assetLive();
  }
  function startWS() {
    if (ws || !funded() || typeof WebSocket === 'undefined') return;
    try {
      ws = new WebSocket('wss://ws-feed.exchange.coinbase.com');
      ws.onopen = () => { wsOk = true; ws.send(JSON.stringify({ type: 'subscribe', product_ids: (CV.cfg.coins || ['BTC', 'ETH', 'SOL']).map((c) => c + '-USD'), channels: ['ticker'] })); setLive(); };
      ws.onmessage = (e) => { try { const m = JSON.parse(e.data); if (m.type === 'ticker' && m.product_id && +m.price > 0) { live[m.product_id.split('-')[0]] = +m.price; tick(); } } catch (x) { /* ignore */ } };
      ws.onclose = () => { ws = null; wsOk = false; setLive(); setTimeout(() => { if (document.visibilityState === 'visible') startWS(); }, 5000); };
      ws.onerror = () => { try { ws.close(); } catch (x) { /* closed */ } };
    } catch (e) { ws = null; }
  }

  function render() {
    renderAccount();
    renderFills();
    renderProfit();
    renderTeam();
    if ($('loading')) $('loading').remove();
    setLive();
    showView();
  }

  // ── data: the newest account file straight from the repository, the published copy as the fallback
  const RAW = (() => {
    const m = /^([^.]+)\.github\.io$/.exec(location.hostname), repo = location.pathname.split('/').filter(Boolean)[0];
    return m && repo ? `https://raw.githubusercontent.com/${m[1]}/${repo}/main/data/state.json` : null;
  })();
  async function load() {
    if (RAW) {
      try { const r = await fetch(RAW + '?ts=' + Date.now(), { cache: 'no-store' }); if (r.ok) return await r.json(); } catch (e) { /* fall back */ }
    }
    const r = await fetch('data/state.json?ts=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('계좌 파일을 받지 못했습니다 (' + r.status + ')');
    return r.json();
  }
  const RAWC = RAW ? RAW.replace(/state\.json$/, 'crypto/view.json') : null;
  async function loadCrypto() {
    for (const u of [RAWC, 'data/crypto/view.json'].filter(Boolean)) {
      try { const r = await fetch(u + '?ts=' + Date.now(), { cache: 'no-store' }); if (r.ok) { const v = await r.json(); if (v && v.v) return v; } } catch (e) { /* next */ }
    }
    return null;
  }
  async function refresh() {
    try {
      const st = await load();
      if (!S || st.built !== S.built) { S = st; applyLive(); render(); } else setLive();
    } catch (e) { /* keep the last good state */ }
  }
  async function refreshCrypto() {
    const v = await loadCrypto();
    if (v && (!CV || v.at !== CV.at)) { CV = v; if (S) { applyLive(); renderAccount(); renderFills(); renderProfit(); renderTeam(); showView(); } coinBasis(); }
    startWS();
  }
  async function main() {
    showView();
    try { const [st, cv] = await Promise.all([load(), loadCrypto()]); CV = cv; S = st; lastV = viewKey(); render(); startWS(); coinBasis(); livePoll(); setInterval(livePoll, 2500); }
    catch (err) { $('loading').textContent = '불러오지 못했습니다: ' + (err.message || err) + ' 잠시 뒤 새로 고침해 주세요.'; }
    setInterval(() => { if (document.visibilityState === 'visible') refresh(); }, 60000);
    setInterval(() => { if (document.visibilityState === 'visible') refreshCrypto(); }, 20000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { refresh(); refreshCrypto(); } });
  }
  main();
})();
</script>
</body>
</html>
