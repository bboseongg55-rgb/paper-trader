# 검증용 과거 시세: 코인 1시간·1분봉과 토큰화 주식 1시간봉을 받아 data/hist/에 저장합니다(필요할 때만 수동 실행).
name: hist
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: hist
  cancel-in-progress: false
jobs:
  hist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch history
        run: node tools/fetch_hist.mjs
      - name: Save
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hist
          git commit -q -m "data: history for the strategy checks" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
