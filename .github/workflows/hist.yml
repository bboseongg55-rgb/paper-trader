# 검증용 과거 시세: 코인 1시간·1분봉과 토큰화 주식 1시간봉을 받아 data/hist/에 저장합니다(필요할 때만 수동 실행).
name: hist
on:
  workflow_dispatch:
    inputs:
      what:
        description: 'all | fred | long | both'
        required: false
        default: 'all'
permissions:
  contents: write
concurrency:
  group: hist-${{ github.event.inputs.what || 'all' }}
  cancel-in-progress: false
jobs:
  hist:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # the long fetch saves as it goes and stops itself after LONG_MIN minutes; if a step still runs over, what it has
      # written is committed anyway and the next run continues from there
      - name: Fetch history
        timeout-minutes: 58
        continue-on-error: true
        run: |
          if [ "$WHAT" = "long" ] || [ "$WHAT" = "both" ]; then node tools/fetch_long.mjs; fi
          if [ "$WHAT" != "long" ]; then node tools/fetch_hist.mjs; fi
        env:
          WHAT: ${{ github.event.inputs.what || 'all' }}
          LONG_MIN: 42
      - name: Save
        if: always()
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hist
          git commit -q -m "data: history for the strategy checks" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
