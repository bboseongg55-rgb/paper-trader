# 자동매매 연습장: collects prices about every 15 minutes during the US session, runs the trading engine,
# saves the data and publishes the page on GitHub Pages. No API keys: public price sources only.
name: trade
on:
  schedule:
    - cron: '7,22,37,52 13-21 * * 1-5'   # US session in both summer and winter time; the script checks the New York clock
    - cron: '41 1 * * 2-6'               # evening: official closes and the S&P 500 from public snapshots
  workflow_dispatch:
    inputs:
      mode:
        description: 'collect | collect-now | nightly | rebuild | probe'
        required: true
        default: rebuild
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: trade
  cancel-in-progress: false
jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy: ${{ steps.site.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mode
        id: mode
        run: |
          M="${{ github.event.inputs.mode }}"
          if [ -z "$M" ]; then
            if [ "${{ github.event.schedule }}" = "41 1 * * 2-6" ]; then M=nightly; else M=collect; fi
          fi
          echo "mode=$M" >> "$GITHUB_OUTPUT"
          echo "mode: $M"
      - name: Probe price sources
        if: steps.mode.outputs.mode == 'probe'
        run: node tools/probe.mjs
      - name: Intraday prices
        id: collect
        if: steps.mode.outputs.mode == 'collect' || steps.mode.outputs.mode == 'collect-now'
        run: node tools/collect.mjs ${{ steps.mode.outputs.mode == 'collect-now' && '--force' || '' }}
      - name: Evening closes from public snapshots
        if: steps.mode.outputs.mode == 'nightly'
        run: |
          SINCE=$(date -u -d '21 days ago' +%F)
          AFTER=$(node -e "const s=require('./data/settings.json');const a=new Date(Date.now()-14*864e5).toISOString().slice(0,10);console.log(a>s.seedLast?a:s.seedLast)")
          git clone -q --filter=blob:none --no-checkout --shallow-since=$SINCE https://github.com/rreichel3/US-Stock-Symbols /tmp/uss
          git clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/ravelab/l-etf /tmp/letf
          python3 tools/feed_live.py /tmp/uss /tmp/letf /tmp/feed.json $SINCE $AFTER
          node tools/merge_feed.mjs /tmp/feed.json
      - name: Run the engine
        id: run
        if: steps.mode.outputs.mode == 'nightly' || steps.mode.outputs.mode == 'rebuild' || steps.collect.outputs.changed == 'true'
        run: node tools/run.mjs
      - name: Save data
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -q -m "data: ${{ steps.mode.outputs.mode }} $(TZ=America/New_York date '+%F %H:%M') ET"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
      - name: Build site
        id: site
        if: steps.run.outcome == 'success'
        run: |
          mkdir -p _site/data
          cp index.html engine.js _site/
          cp -r fonts _site/
          cp data/state.json _site/data/
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        if: steps.run.outcome == 'success'
        with:
          path: _site
  deploy:
    needs: trade
    if: needs.trade.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
