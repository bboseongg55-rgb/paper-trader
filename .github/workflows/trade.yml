# 자동매매 연습장: during the US session one job collects prices every 5 minutes, runs the trading engine and saves
# the data; the page reads data/state.json from the repository. No API keys: public price sources only.
name: trade
on:
  schedule:
    - cron: '3 13-20 * * 1-5'   # keeps one session job alive through US market hours (it waits for the open)
    - cron: '41 1 * * 2-6'      # evening: official closes and the S&P 500 from public snapshots
  workflow_dispatch:
    inputs:
      mode:
        description: 'session | collect-now | nightly | rebuild | probe | probe-assets | probe-more | bonds-hist | macro-hist'
        required: true
        default: session
permissions:
  contents: write
concurrency:
  group: trade
  cancel-in-progress: false
jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mode
        id: mode
        run: |
          M="${{ github.event.inputs.mode }}"
          if [ -z "$M" ]; then
            if [ "${{ github.event.schedule }}" = "41 1 * * 2-6" ]; then M=nightly; else M=session; fi
          fi
          echo "mode=$M" >> "$GITHUB_OUTPUT"
          echo "mode: $M"
      - name: Market session (every 5 minutes)
        if: steps.mode.outputs.mode == 'session'
        run: bash tools/session.sh
      - name: Probe price sources
        if: steps.mode.outputs.mode == 'probe'
        run: node tools/probe.mjs
      - name: Probe sources for bonds, currencies, futures, options and crypto
        if: steps.mode.outputs.mode == 'probe-assets'
        run: node tools/probe_assets.mjs
      - name: Probe sources for tokenized stocks, futures rolls, volatility and rate history
        if: steps.mode.outputs.mode == 'probe-more'
        run: node tools/probe_more.mjs
      - name: Collect once now
        if: steps.mode.outputs.mode == 'collect-now'
        run: node tools/collect.mjs --force
      - name: Evening closes from public snapshots
        if: steps.mode.outputs.mode == 'nightly'
        run: |
          SINCE=$(date -u -d '21 days ago' +%F)
          AFTER=$(node -e "const s=require('./data/settings.json');const a=new Date(Date.now()-14*864e5).toISOString().slice(0,10);console.log(a>s.seedLast?a:s.seedLast)")
          git clone -q --filter=blob:none --no-checkout --shallow-since=$SINCE https://github.com/rreichel3/US-Stock-Symbols /tmp/uss
          git clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/ravelab/l-etf /tmp/letf
          python3 tools/feed_live.py /tmp/uss /tmp/letf /tmp/feed.json $SINCE $AFTER
          node tools/merge_feed.mjs /tmp/feed.json
      - name: Bond history (yields, currencies, bond ETFs and their distributions)
        if: steps.mode.outputs.mode == 'nightly' || steps.mode.outputs.mode == 'bonds-hist'
        run: node tools/bonds_hist.mjs || echo "bond history not refreshed"
      - name: Market picture and futures history, live futures and option quotes (the allocator and the derivatives part)
        if: steps.mode.outputs.mode == 'nightly' || steps.mode.outputs.mode == 'macro-hist' || steps.mode.outputs.mode == 'rebuild'
        run: |
          node tools/macro_hist.mjs || echo "market history not refreshed"
          node tools/markets.mjs || echo "live market quotes not refreshed"
      - name: Run the engine and save
        if: steps.mode.outputs.mode != 'session' && steps.mode.outputs.mode != 'probe' && steps.mode.outputs.mode != 'probe-assets' && steps.mode.outputs.mode != 'probe-more' && steps.mode.outputs.mode != 'macro-hist'
        run: |
          node tools/run.mjs
          bash tools/save.sh "${{ steps.mode.outputs.mode }}"
      - name: Save probe
        if: steps.mode.outputs.mode == 'probe' || steps.mode.outputs.mode == 'probe-assets' || steps.mode.outputs.mode == 'probe-more' || steps.mode.outputs.mode == 'macro-hist'
        run: bash tools/save.sh probe
